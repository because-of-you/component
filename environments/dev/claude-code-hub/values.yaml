replicaCount: 1

image:
  repository: registry.cn-shenzhen.aliyuncs.com/gravitation/claude-code-hub
  pullPolicy: Always

ingressRoute:
  enabled: true
  host: inner.coding.acitrus.cn
  entryPoints:
    - websecure
  tls:
    certResolver: leresolver

config:
  dbPoolMax: 8
  oidc:
    enabled: true
    issuerUrl: https://auth.acitrus.cn
    clientId: claude-code-hub
    redirectUri: https://inner.coding.acitrus.cn/api/auth/oidc/callback
    requiredGroup: lldap_admin

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

databaseBootstrap:
  enabled: true
  host: postgresql.infra.svc.cluster.local
  database: claude_code_hub
  existingSecret: claude-code-hub-secrets
