authelia:
  pod:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 1000m
        memory: 256Mi

  configMap:
    access_control:
      default_policy: deny
      rules:
        - domain: ldap.acitrus.cn
          policy: one_factor
          subject:
            - group:lldap_admin

    authentication_backend:
      ldap:
        enabled: true
        implementation: lldap
        address: ldap://lldap.infra.svc.cluster.local:3890
        base_dn: dc=acitrus,dc=cn
        user: uid=authelia,ou=people,dc=acitrus,dc=cn

    session:
      cookies:
        - domain: acitrus.cn
          subdomain: auth
      redis:
        enabled: true
        deploy: false
        host: redis-master.infra.svc.cluster.local
        port: 6379
        database_index: 1

    storage:
      local:
        enabled: false
      postgres:
        enabled: true
        deploy: false
        address: tcp://postgresql.infra.svc.cluster.local:5432
        database: authelia
        schema: public
        username: postgres

    identity_providers:
      oidc:
        enabled: true
        hmac_secret:
          path: identity_providers.oidc.hmac.key
        claims_policies:
          claude_code_hub:
            id_token:
              - email
              - email_verified
              - groups
              - name
              - preferred_username
          rustfs:
            id_token:
              - email
              - email_verified
              - groups
              - name
              - preferred_username
        jwks:
          - algorithm: RS256
            use: sig
            key:
              path: /secrets/oidc/identity_providers.oidc.jwk.RS256.pem
        clients:
          - client_id: claude-code-hub
            client_name: Claude Code Hub
            client_secret:
              path: /secrets/oidc/identity_providers.oidc.clients.claude-code-hub.secret.txt
            authorization_policy: one_factor
            claims_policy: claude_code_hub
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://inner.coding.acitrus.cn/api/auth/oidc/callback
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
            response_types:
              - code
            token_endpoint_auth_method: client_secret_basic
          - client_id: rustfs-console
            client_name: RustFS Console
            client_secret:
              path: /secrets/oidc/identity_providers.oidc.clients.rustfs-console.secret.txt
            authorization_policy: one_factor
            claims_policy: rustfs
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://s3.acitrus.cn/rustfs/admin/v3/oidc/callback/default
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
            response_types:
              - code
            token_endpoint_auth_method: client_secret_post

  secret:
    existingSecret: authelia-secrets
    additionalSecrets:
      authelia-secrets:
        path: oidc
        items:
          - key: identity_providers.oidc.jwk.RS256.pem
            path: identity_providers.oidc.jwk.RS256.pem
          - key: identity_providers.oidc.clients.claude-code-hub.secret.txt
            path: identity_providers.oidc.clients.claude-code-hub.secret.txt
          - key: identity_providers.oidc.clients.rustfs-console.secret.txt
            path: identity_providers.oidc.clients.rustfs-console.secret.txt

databaseBootstrap:
  enabled: true
  host: postgresql.infra.svc.cluster.local
  database: authelia
  existingSecret: postgresql-auth

autheliaIngress:
  enabled: true
  host: auth.acitrus.cn
  entryPoints:
    - websecure
  tls:
    certResolver: leresolver

autheliaForwardAuth:
  enabled: true
  address: http://authelia.infra.svc.cluster.local/api/authz/forward-auth
