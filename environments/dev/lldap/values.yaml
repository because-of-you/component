lldap:
  env:
    TZ: Asia/Shanghai
    UID: "1000"
    GID: "1000"
    LDAPS_OPTIONS__ENABLED: false

  extraEnv:
    - name: LLDAP_DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: lldap-secrets
          key: database-url
    - name: LLDAP_HTTP_URL
      value: https://ldap.acitrus.cn

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  hpa:
    enabled: false

  service:
    type: ClusterIP

  ingress:
    enabled: false

  certmanager:
    enabled: false

  serviceAccount:
    create: false

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  secret:
    create: false
    name: lldap-secrets
    useExisting: true

ingressRoute:
  enabled: true
  name: lldap
  host: ldap.acitrus.cn
  entryPoints:
    - websecure
  middlewares:
    - name: authelia-forwardauth
      namespace: infra
  service:
    name: lldap
    port: 17170
  tls:
    store:
      name: default
      namespace: traefik
