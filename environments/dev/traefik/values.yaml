traefik:
  image:
    registry: registry.cn-shenzhen.aliyuncs.com
    repository: gravitation/traefik
    tag: v3.7.12

  deployment:
    kind: DaemonSet

  service:
    spec:
      type: LoadBalancer
      externalTrafficPolicy: Local

  tolerations:
    - key: node.kubernetes.io/unschedulable
      operator: Exists
      effect: NoSchedule

  ports:
    gravitation:
      port: 1024
      expose:
        default: true
      exposedPort: 1024
      protocol: TCP

    metrics:
      http:
        aliasHeadersStrategy: delete

    traefik:
      http:
        aliasHeadersStrategy: delete

    web:
      http:
        aliasHeadersStrategy: delete

    websecure:
      http3:
        enabled: true
        advertisedPort: 443
      http:
        aliasHeadersStrategy: delete
        tls:
          enabled: true
          options: ""

  tlsStore:
    default:
      defaultCertificate:
        secretName: acitrus-tls

  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.acitrus.cn`)
      entryPoints:
        - websecure
        - web
      middlewares:
        - name: authelia-forwardauth
          namespace: infra

  providers:
    kubernetesCRD:
      allowCrossNamespace: true
      enabled: true
      safeNaming: true

  # Temporary diagnostics for client-IP forwarding. Keep only the relevant
  # forwarded headers; do not log cookies or authorization headers.
  accessLog:
    enabled: true
    format: json
    fields:
      defaultMode: keep
      headers:
        defaultMode: drop
        names:
          X-Forwarded-For: keep
          X-Real-IP: keep
          Forwarded: keep
