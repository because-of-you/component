traefik:
  envFrom:
    - secretRef:
        name: alidns

  ports:
    gravitation:
      port: 1024
      expose:
        default: true
      exposedPort: 1024
      protocol: TCP

    websecure:
      http3:
        enabled: true
        advertisedPort: 443
      http:
        tls:
          enabled: true
          options: ""
          certResolver: leresolver
          domains:
            - main: acitrus.cn
              sans:
                - "*.acitrus.cn"
                - "*.ui.acitrus.cn"
                - "*.tcp.acitrus.cn"

  certificatesResolvers:
    leresolver:
      acme:
        storage: /data/acme.json
        email: mail@acitrus.cn
        dnsChallenge:
          provider: alidns
          delayBeforeCheck: 0

  persistence:
    enabled: true

  deployment:
    initContainers:
      - name: volume-permissions
        image: busybox:latest
        command: ["sh", "-c", "touch /data/acme.json; chmod -v 600 /data/acme.json"]
        volumeMounts:
          - name: data
            mountPath: /data

  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.acitrus.cn`)
      entryPoints:
        - websecure
        - web

  providers:
    kubernetesCRD:
      allowCrossNamespace: true
      enabled: true

casdoorAuthorization:
  enforceEndpoint: http://casdoor.infra.svc.cluster.local:8000
