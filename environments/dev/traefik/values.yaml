traefik:
  image:
    registry: registry.cn-shenzhen.aliyuncs.com
    repository: gravitation/traefik
    tag: v3.7.12

  deployment:
    kind: DaemonSet

  service:
    spec:
      # All public ports are bound directly by the Traefik DaemonSet below.
      # Keep the Kubernetes Service internal so k3s ServiceLB is not involved.
      type: ClusterIP

  tolerations:
    - key: node.kubernetes.io/unschedulable
      operator: Exists
      effect: NoSchedule

  ports:
    gravitation:
      port: 1024
      hostPort: 1024
      expose:
        default: true
      exposedPort: 1024
      protocol: TCP

    metrics:
      http:
        aliasHeadersStrategy: delete

    traefik:
      http:
        aliasHeadersStrategy: delete

    web:
      hostPort: 80
      http:
        aliasHeadersStrategy: delete

    websecure:
      hostPort: 443
      http3:
        enabled: true
        advertisedPort: 443
      http:
        aliasHeadersStrategy: delete
        tls:
          enabled: true
          options: ""

  tlsStore:
    default:
      defaultCertificate:
        secretName: acitrus-tls

  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.acitrus.cn`)
      entryPoints:
        - websecure
        - web
      middlewares:
        - name: authelia-forwardauth
          namespace: infra

  providers:
    kubernetesCRD:
      allowCrossNamespace: true
      enabled: true
      safeNaming: true
