image:
  repository: registry.cn-shenzhen.aliyuncs.com/gravitation/robustmq
  tag: v0.4.11
  pullPolicy: IfNotPresent

persistence:
  enabled: true
  storageClass: local-path
  size: 10Gi

ingressRoute:
  enabled: true
  host: mq.acitrus.cn
  entryPoints:
    - websecure
  middlewares:
    - name: authelia-forwardauth
      namespace: infra
  tls:
    store:
      name: default
      namespace: traefik

dashboard:
  apiBaseUrl: https://mq.acitrus.cn

# Development-only public MQTT endpoint. Traefik terminates TLS on the shared
# gravitation entrypoint and forwards plaintext MQTT to service port 1883.
mqttIngressRoute:
  enabled: true
  host: mqtt.tcp.acitrus.cn
  entryPoints:
    - gravitation
  tls:
    store:
      name: default
      namespace: traefik

# RobustMQ AMQP support is experimental; expose it only in dev for protocol
# compatibility testing. Traefik terminates TLS and forwards to port 5672.
amqpIngressRoute:
  enabled: true
  host: amqp.tcp.acitrus.cn
  entryPoints:
    - gravitation
  tls:
    store:
      name: default
      namespace: traefik

resources:
  requests:
    cpu: 20m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 2Gi
