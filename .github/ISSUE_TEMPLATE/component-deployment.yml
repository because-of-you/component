name: "组件部署"
description: "部署组件到 Kubernetes 集群"
title: "[部署] 组件部署请求"
labels: ["deployment"]
body:
  - type: markdown
    attributes:
      value: |
        # 组件部署请求
        
        请填写以下信息来创建部署请求。提交后，系统会创建一个包含默认配置的评论，您可以在评论中修改配置并确认。

  - type: dropdown
    id: component_type
    attributes:
      label: "组件类型"
      description: "请选择要部署的组件"
      options:
        - Kafka
        - Redis
        - MySQL
        - PostgreSQL
    validations:
      required: true

  - type: input
    id: deployment_name
    attributes:
      label: "部署名称"
      description: "请为您的部署命名，只能包含小写字母、数字和连字符"
      placeholder: "例如: kafka-production"
    validations:
      required: true
      pattern: '^[a-z0-9-]+$'

  - type: input
    id: namespace
    attributes:
      label: "命名空间"
      description: "请输入要部署到的命名空间"
      value: "default"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "部署描述"
      description: "请简要描述此部署的目的和用途"
      placeholder: "例如：为测试环境部署 Kafka 消息队列"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 后续步骤
        
        1. 提交此表单后，系统会创建一个包含默认配置的评论
        2. 检查并修改配置（如果需要）
        3. 使用 `/deploy` 命令确认部署
        4. 系统将开始部署流程
        
        注意：您需要有相应的权限才能执行部署操作。
