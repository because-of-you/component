name: "Kafka 组件部署"
description: "部署 Kafka 组件到 Kubernetes 集群"
title: "[部署] Kafka 组件部署请求"
labels: ["deployment", "kafka"]
body:
  - type: markdown
    attributes:
      value: "# Kafka 组件部署请求"
  
  - type: input
    id: deployment_name
    attributes:
      label: "部署名称"
      description: "请为您的部署命名"
      placeholder: "例如: kafka-dev"
    validations:
      required: true

  - type: input
    id: replica_count
    attributes:
      label: "副本数量"
      description: "请输入 Kafka broker 的副本数量"
      placeholder: "例如: 3"
    validations:
      required: true
      number: true

  - type: textarea
    id: full_config
    attributes:
      label: "完整配置"
      description: "请在此处输入完整的 Kafka 配置，或保留默认配置"
      value: |
        replicaCount: 3
        persistence:
          enabled: true
          size: 10Gi
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: "确认事项"
      options:
        - label: "我已阅读并理解部署说明"
          required: true
        - label: "我了解部署后需要执行生成的 Helm 命令进行实际部署"
          required: true
