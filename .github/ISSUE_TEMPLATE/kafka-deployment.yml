name: Kafka 组件部署
description: 部署 Kafka 组件到 Kubernetes 集群
title: "[部署] Kafka 组件部署请求"
labels: [deployment, kafka]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        # Kafka 组件部署请求
        
        请选择配置方式并填写必要信息以部署 Kafka 组件到 Kubernetes 集群。

  - type: dropdown
    id: config_method
    attributes:
      label: 配置方式
      description: 选择配置方式
      options:
        - 使用简易表单（推荐）
        - 使用完整 YAML 配置
    validations:
      required: true

  - type: input
    id: deployment_name
    attributes:
      label: 部署名称
      description: 请为您的部署命名
      placeholder: 例如: kafka-dev
    validations:
      required: true

  # 简易表单部分
  - type: markdown
    id: simple_form_header
    attributes:
      value: "## 简易配置 (当选择'使用简易表单'时填写)"

  - type: input
    id: replica_count
    attributes:
      label: 副本数量
      description: 请输入 Kafka broker 的副本数量
      placeholder: 例如: 3
    validations:
      required: false
      number: true

  - type: input
    id: storage_size
    attributes:
      label: 存储空间
      description: 每个 broker 的存储空间
      placeholder: 例如: 10Gi
    validations:
      required: false

  - type: textarea
    id: custom_resources
    attributes:
      label: 资源配置
      description: 资源配置（requests 和 limits）
      placeholder: |
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
    validations:
      required: false

  - type: dropdown
    id: external_access
    attributes:
      label: 外部访问
      description: 是否需要外部访问
      options:
        - 否
        - 是
    validations:
      required: false

  # 完整 YAML 配置部分
  - type: markdown
    id: yaml_config_header
    attributes:
      value: |
        ## 完整 YAML 配置 (当选择'使用完整 YAML 配置'时填写)
        
        [点击查看完整配置示例](https://github.com/your-org/your-repo/blob/main/helm/configs/kafka/sample.yaml)
        
        请参考以下示例配置，并在下方填写您的完整配置：
        
        ```yaml
        # 示例配置 (点击上方链接查看完整示例)
        replicaCount: 3
        
        persistence:
          enabled: true
          size: 10Gi
        
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        
        externalAccess:
          enabled: false
        ```

  - type: textarea
    id: full_yaml_config
    attributes:
      label: 完整 YAML 配置
      description: 请在此处输入完整的 Kafka 配置
      placeholder: |
        # 在此处粘贴您的完整 YAML 配置
        replicaCount: 3
        persistence:
          enabled: true
          size: 10Gi
        # ... 其他配置
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 配置参考
        
        请参考 [kafka 配置示例](https://github.com/your-org/your-repo/blob/main/helm/configs/kafka/sample.yaml) 来配置您的部署。

  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      options:
        - label: 我已阅读并理解部署说明
          required: true
        - label: 我了解部署后需要执行生成的 Helm 命令进行实际部署
          required: true
        - label: 我了解当关闭此 issue 时，相关配置文件将被删除
          required: true