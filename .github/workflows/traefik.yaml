# .github/workflows/deploy.yml
name: traefik-deploy
on:
  push:
    tags:
      - traefik-*.*.*
    branches:
      - traefik-*.*.*
      - rabbitmq-*.*.*

env:
  CHART_VERSION: 34.2.0

jobs:
  deployment:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4


      # https://github.com/marketplace/actions/kubernetes-cli-kubectl
      - uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBECONFIG_BASED }}

      - name: Generate kubeconfig
        run: |
          kubectl apply -k charts/traefik/workloads

      - uses: azure/setup-helm@v4.2.0
        with:
           version: '3.16.4' # default is latest (stable)
        id: install

      # https://github.com/because-of-you/helm-deploy
      - name: 'traefik'
        # 镜像
        uses: because-of-you/helm-deploy@master
        with:
          release: 'traefik'
          namespace: 'traefik'
          # https://github.com/traefik/traefik-helm-chart
          chart: 'oci://ghcr.io/traefik/helm/traefik'
          token: '${{ github.token }}'
          version: ${{ env.CHART_VERSION }}
          value-files: "charts/traefik/sample.yaml"
          timeout: 30m0s
        env:
          KUBECONFIG_FILE: '${{ secrets.KUBECONFIG }}'

