name: Deploy Helm Chart

# ========================================
# 独立的 Helm 部署流水线
# ========================================
on:
  workflow_dispatch:
    inputs:
      deployment_name:
        description: '部署名称'
        required: true
        type: string
      namespace:
        description: '命名空间'
        required: true
        type: string
      component_type:
        description: '组件类型'
        required: true
        type: choice
        options:
          - redis
          - mysql
          - postgresql
          - mongodb
          - kafka
          - elasticsearch
      values_content:
        description: 'Values YAML 内容 (Base64)'
        required: true
        type: string
      issue_number:
        description: 'Issue 编号'
        required: true
        type: string
      dry_run_only:
        description: '仅执行 dry-run 测试（true=仅测试，false=实际部署）'
        required: true
        type: boolean
        default: true
  
  workflow_call:
    inputs:
      deployment_name:
        required: true
        type: string
      namespace:
        required: true
        type: string
      component_type:
        required: true
        type: string
      values_content:
        required: true
        type: string
      issue_number:
        required: true
        type: string
      dry_run_only:
        required: true
        type: boolean
        default: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.validation.outputs.status }}
      deployment_status: ${{ steps.deployment.outputs.status }}
    
    steps:
      # ========================================
      # 1. 准备环境
      # ========================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
      
      - name: 🔧 Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'
      
      # ========================================
      # 2. 准备配置文件
      # ========================================
      - name: 📝 Prepare values file
        id: prepare
        run: |
          echo "========================================="
          echo "📝 准备配置文件"
          echo "========================================="
          
          # 显示运行模式
          if [ "${{ inputs.dry_run_only }}" = "true" ]; then
            echo "🔍 运行模式: 仅验证 (Dry-run)"
          else
            echo "🧪 运行模式: 测试部署（生成命令）"
          fi
          echo ""
          
          # 解码 values 内容
          echo "${{ inputs.values_content }}" | base64 -d > /tmp/values.yaml
          
          echo "📦 组件类型: ${{ inputs.component_type }}"
          echo "🏷️ 部署名称: ${{ inputs.deployment_name }}"
          echo "🌐 命名空间: ${{ inputs.namespace }}"
          echo "📋 Issue: #${{ inputs.issue_number }}"
          echo ""
          echo "配置内容:"
          echo "----------------------------------------"
          cat /tmp/values.yaml
          echo "----------------------------------------"
          
          # 从配置文件读取 Chart URL
          echo ""
          echo "📖 读取组件映射配置..."
          
          # 安装 yq 工具（GitHub Actions 环境）
          if ! command -v yq &> /dev/null; then
            echo "📦 安装 yq 工具..."
            wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            chmod +x /usr/local/bin/yq
          fi
          
          # 检查组件是否存在
          COMPONENT="${{ inputs.component_type }}"
          
          # 使用 yq 读取 Chart URL
          CHART_URL=$(yq eval ".components.$COMPONENT.chart" component-charts.yaml)
          CHART_DESC=$(yq eval ".components.$COMPONENT.description" component-charts.yaml)
          
          if [ "$CHART_URL" = "null" ] || [ -z "$CHART_URL" ]; then
            echo "❌ 不支持的组件类型: $COMPONENT"
            echo ""
            echo "📝 支持的组件类型："
            yq eval '.components | keys | .[]' component-charts.yaml | while read -r comp; do
              desc=$(yq eval ".components.$comp.description" component-charts.yaml)
              echo "  - $comp: $desc"
            done
            exit 1
          fi
          
          echo "CHART_URL=$CHART_URL" >> $GITHUB_OUTPUT
          echo "📊 Chart URL: $CHART_URL"
          echo "📝 组件描述: $CHART_DESC"
      
      # ========================================
      # 3. 验证配置
      # ========================================
      - name: 🔍 Validate configuration
        id: validation
        run: |
          echo "========================================="
          echo "🔍 验证配置"
          echo "========================================="
          
          CHART_URL="${{ steps.prepare.outputs.CHART_URL }}"
          
          # 验证 YAML 语法（使用 yq）
          echo "🐛 验证 YAML 语法..."
          if yq eval '.' /tmp/values.yaml > /dev/null 2>&1; then
            echo "✅ YAML 语法验证通过"
          else
            echo "❌ YAML 语法错误"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # 获取默认 values
          echo ""
          echo "📥 获取 Chart 默认配置..."
          helm show values "$CHART_URL" > /tmp/default-values.yaml || true
          
          # 模板验证（不需要连接集群）
          echo ""
          echo "========================================="
          echo "🔧 验证 Helm Chart 模板"
          echo "========================================="
          
          echo "执行命令:"
          echo "helm template ${{ inputs.deployment_name }} $CHART_URL \\"
          echo "  --namespace ${{ inputs.namespace }} \\"
          echo "  --values /tmp/values.yaml"
          echo ""
          
          # 使用 helm template 代替 helm upgrade --dry-run
          # helm template 不需要连接到 Kubernetes 集群
          # 不使用 --validate 因为它需要连接集群验证 API 版本
          if helm template "${{ inputs.deployment_name }}" "$CHART_URL" \
            --namespace "${{ inputs.namespace }}" \
            --values /tmp/values.yaml > /tmp/template-output.yaml 2> /tmp/template-error.log; then
            
            echo "✅ 模板验证通过"
            echo "status=success" >> $GITHUB_OUTPUT
            
            # 显示生成的资源统计
            echo ""
            echo "📋 生成的 Kubernetes 资源:"
            echo "----------------------------------------"
            echo "$(grep '^kind:' /tmp/template-output.yaml | sort | uniq -c)"
            echo "----------------------------------------"
            echo "总计: $(grep '^---$' /tmp/template-output.yaml | wc -l) 个资源"
            
          else
            echo "❌ 模板验证失败"
            echo "status=failed" >> $GITHUB_OUTPUT
            echo ""
            echo "错误输出:"
            echo "----------------------------------------"
            cat /tmp/template-error.log
            exit 1
          fi
      
      # ========================================
      # 4. 执行实际部署（仅当 dry_run_only=false 时）
      # ========================================
      - name: 🧪 Generate Deployment Command
        id: deployment
        if: ${{ inputs.dry_run_only == false && steps.validation.outputs.status == 'success' }}
        run: |
          echo "========================================="
          echo "🧪 生成部署命令"
          echo "========================================="
          
          echo "📋 以下命令可供用户手动执行部署"
          
          CHART_URL="${{ steps.prepare.outputs.CHART_URL }}"
          
          echo "📦 部署名称: ${{ inputs.deployment_name }}"
          echo "🌐 命名空间: ${{ inputs.namespace }}"
          echo "📊 Chart: $CHART_URL"
          echo ""
          
          # 生成部署命令
          echo ""
          echo "========================================="
          echo "📦 Helm 部署命令："
          echo "========================================="
          echo ""
          echo "helm upgrade --install ${{ inputs.deployment_name }} $CHART_URL \\"
          echo "  --namespace ${{ inputs.namespace }} \\"
          echo "  --create-namespace \\"
          echo "  --atomic \\"
          echo "  --timeout 10m \\"
          echo "  --wait \\"
          echo "  --values values.yaml"
          echo ""
          echo "========================================="
          echo "📝 请将 values.yaml 文件和上述命令保存后执行"
          echo "========================================="
          
          # 再次使用 template 验证
          if helm template "${{ inputs.deployment_name }}" "$CHART_URL" \
            --namespace "${{ inputs.namespace }}" \
            --values /tmp/values.yaml > /dev/null 2>&1; then
            
            echo ""
            echo "✅ 命令验证通过！"
            echo "status=success" >> $GITHUB_OUTPUT
            
            # 显示 values 文件内容
            echo ""
            echo "========================================="
            echo "📄 values.yaml 文件内容："
            echo "========================================="
            echo ""
            cat /tmp/values.yaml
            echo ""
            echo "========================================="
            
            # 显示查看状态的命令
            echo ""
            echo "🔍 部署后可用以下命令查看状态："
            echo "========================================="
            echo "helm status ${{ inputs.deployment_name }} -n ${{ inputs.namespace }}"
            echo "kubectl get all -n ${{ inputs.namespace }} -l app.kubernetes.io/instance=${{ inputs.deployment_name }}"
            echo "helm get notes ${{ inputs.deployment_name }} -n ${{ inputs.namespace }}"
            echo "========================================="
            
          else
            echo ""
            echo "❌ 命令验证失败"
            echo "status=failed" >> $GITHUB_OUTPUT
            
            echo ""
            echo "请检查配置文件是否正确"
            
            exit 1
          fi
      
      # ========================================
      # 5. 保存部署信息
      # ========================================
      - name: 💾 Save deployment info
        if: steps.deployment.outputs.status == 'success'
        run: |
          # 创建部署信息文件
          cat > /tmp/deployment-info.json << EOF
          {
            "deployment_name": "${{ inputs.deployment_name }}",
            "namespace": "${{ inputs.namespace }}",
            "component_type": "${{ inputs.component_type }}",
            "issue_number": "${{ inputs.issue_number }}",
            "deployed_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "deployed_by": "${{ github.actor }}",
            "workflow_run": "${{ github.run_id }}",
            "chart_url": "${{ steps.prepare.outputs.CHART_URL }}"
          }
          EOF
          
          echo "📊 部署信息已保存"
      
      # ========================================
      # 6. 更新 Issue 状态
      # ========================================  
      - name: 📢 Update issue status
        if: always() && inputs.issue_number != ''
        uses: actions/github-script@v6
        with:
          script: |
            const issueNumber = '${{ inputs.issue_number }}';
            const isDryRun = ${{ inputs.dry_run_only }};
            const validationStatus = '${{ steps.validation.outputs.status }}';
            const deploymentStatus = '${{ steps.deployment.outputs.status }}';
            
            console.log('更新 Issue 状态:');
            console.log('- Dry-run 模式:', isDryRun);
            console.log('- 验证状态:', validationStatus);
            console.log('- 部署状态:', deploymentStatus);
            
            let message = '';
            let labels = [];
            
            if (isDryRun) {
              if (validationStatus === 'success') {
                message = `✅ **配置验证通过**\n\n` +
                  `- 组件: \`${{ inputs.component_type }}\`\n` +
                  `- 名称: \`${{ inputs.deployment_name }}\`\n` +
                  `- 命名空间: \`${{ inputs.namespace }}\`\n\n` +
                  `配置已通过 dry-run 测试，可以安全部署。`;
                labels = ['validation-passed'];
              } else {
                message = `❌ **配置验证失败**\n\n` +
                  `请检查配置文件并修复错误。\n` +
                  `[查看详细日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
                labels = ['validation-failed'];
                
                // 验证失败时，尝试重置预览评论中的复选框
                try {
                  // 获取 Issue 的所有评论
                  const comments = await github.rest.issues.listComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parseInt(issueNumber)
                  });
                  
                  // 查找 bot 的部署预览评论
                  const botComment = comments.data.find(c => 
                    c.user.login === 'github-actions[bot]' && 
                    c.body.includes('🚀 部署配置预览')
                  );
                  
                  if (botComment) {
                    let newBody = botComment.body;
                    // 重置复选框
                    newBody = newBody.replace(/- \[x\] ✅ \*\*确认部署\*\*/gi, '- [ ] ✅ **确认部署**');
                    newBody = newBody.replace(/- \[x\] 🔄 \*\*仅更新配置\*\*/gi, '- [ ] 🔄 **仅更新配置**');
                    
                    // 添加验证失败标记
                    if (!newBody.includes('❌ 验证失败')) {
                      newBody = newBody.replace(/(_Updated at.*_|$)/, '\n\n❌ **验证失败** - 请修复配置错误后重试\n$1');
                    }
                    
                    // 更新评论
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: botComment.id,
                      body: newBody
                    });
                    
                    console.log('✅ 已重置预览评论中的复选框');
                  }
                } catch (error) {
                  console.log('重置复选框失败:', error.message);
                }
              }
            } else {
              // dry_run_only=false 的情况
              if (validationStatus !== 'success') {
                // 验证失败，不应该到这里，但以防万一
                message = `❌ **配置验证失败**\n\n` +
                  `无法生成部署命令，请修复配置错误。\n` +
                  `[查看错误详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
                labels = ['validation-failed'];
              } else if (deploymentStatus === 'success') {
                const configUrl = `https://component.acitrus.cn/deployments/${issueNumber}`;
                message = `✅ **部署命令已生成！**\n\n` +
                  `- 组件: \`${{ inputs.component_type }}\`\n` +
                  `- 名称: \`${{ inputs.deployment_name }}\`\n` +
                  `- 命名空间: \`${{ inputs.namespace }}\`\n\n` +
                  `**部署命令：**\n` +
                  `\`\`\`bash\n` +
                  `helm upgrade --install ${{ inputs.deployment_name }} \\\n` +
                  `  oci://registry-1.docker.io/bitnamicharts/${{ inputs.component_type }} \\\n` +
                  `  --namespace ${{ inputs.namespace }} \\\n` +
                  `  --create-namespace \\\n` +
                  `  --atomic \\\n` +
                  `  --timeout 10m \\\n` +
                  `  --wait \\\n` +
                  `  --values ${configUrl}/values.yaml\n` +
                  `\`\`\`\n\n` +
                  `📎 **配置文件**: [${configUrl}/](${configUrl}/)\n` +
                  `📥 **下载 values.yaml**: [${configUrl}/values.yaml](${configUrl}/values.yaml)\n\n` +
                  `[查看生成日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
                labels = ['command-generated'];
              } else if (validationStatus === 'failed') {
                message = `❌ **配置验证失败**\n\n` +
                  `配置验证未通过，请修复配置错误。\n` +
                  `[查看错误详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
                labels = ['validation-failed'];
              } else {
                message = `❌ **命令生成失败**\n\n` +
                  `生成部署命令时出现错误，请查看日志了解详情。\n` +
                  `[查看错误日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
                labels = ['command-generation-failed'];
              }
            }
            
            // 添加评论
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber),
              body: message
            });
            
            // 移除 processing 标签
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                name: 'processing'
              });
            } catch (e) {
              console.log('移除 processing 标签失败:', e.message);
            }
            
            // 添加标签
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                labels: labels
              });
            }
            
            // 如果是成功生成命令，移除 deployment-preview 标签并关闭 Issue
            if (!isDryRun && deploymentStatus === 'success') {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issueNumber),
                  name: 'deployment-preview'
                });
                console.log('✅ 已移除 deployment-preview 标签');
              } catch (e) {
                console.log('移除 deployment-preview 标签失败:', e.message);
              }
              
              // 关闭 Issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                state: 'closed',
                state_reason: 'completed'
              });
              console.log('✅ Issue 已关闭');
            }