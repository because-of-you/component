# .github/workflows/deploy.yml
name: minio-deploy
on:
  push:
    tags:
      - minio-*.*.*
    branches:
      - minio-*.*.*

env:
  CHART_VERSION: 15.0.3

jobs:
  deployment:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4

      # https://github.com/marketplace/actions/helm-deploy
      - name: 'minio'
        uses: because-of-you/helm-deploy@master
        with:
          release: 'minio'
          namespace: 'default'
          chart: 'oci://registry-1.docker.io/bitnamicharts/minio'
          token: '${{ github.token }}'
          chart-version: ${{ env.CHART_VERSION}}
          timeout: 30m0s
          value-files: "charts/minio/sample.yaml"
        env:
          KUBECONFIG_FILE: '${{ secrets.KUBECONFIG }}'

      # https://github.com/marketplace/actions/kubernetes-cli-kubectl
      - uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBECONFIG_BASED }}

      - name: Generate kubeconfig
        run: |
          kubectl apply -k charts/minio/kustomization
          # mc admin policy attach minio consoleAdmin user="uid=wfy,ou=people,dc=acitrus,dc=cn"
          # mc admin policy attach minio consoleAdmin user="cn=lldap_admin,ou=people,dc=acitrus,dc=cn"
          # 	
          # 	
          # mc idp ldap policy attach local consoleAdmin --group 'cn=lldap_admin,ou=people,dc=acitrus,dc=cn'