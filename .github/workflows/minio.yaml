# .github/workflows/deploy.yml
name: minio-deploy
on:
  push:
    tags:
      - minio-*.*.*
    branches:
      - minio-*.*.*

env:
  CHART_VERSION: 15.0.3

jobs:
  deployment:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4

      # docker 镜像管理模块 ------> 加载docker镜像元数据管理服务
      - name: image-meta-load
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: gravitation/kafka

      # docker 镜像管理模块 ------> 加载docker登陆服务
      - name: registry-login
        uses: docker/login-action@v2
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.ALIYUN_IMAGES_HUB_NAME }}
          password: ${{ secrets.ALIYUN_IMAGES_HUB_PASSWORD }}
          registry: ${{ env.REGISTRY }}

      # docker 镜像管理模块 ------> 加载docker 多平台镜像构建服务
      - name: image-buildx
        uses: docker/setup-buildx-action@v2


      # https://github.com/marketplace/actions/helm-deploy
      - name: 'minio'
        uses: because-of-you/helm-deploy@master
        with:
          release: 'minio'
          namespace: 'default'
          chart: 'oci://registry-1.docker.io/bitnamicharts/minio'
          token: '${{ github.token }}'
          chart-version: ${{ env.CHART_VERSION}}
          timeout: 30m0s
          value-files: "charts/minio/sample.yaml"
        env:
          KUBECONFIG_FILE: '${{ secrets.KUBECONFIG }}'