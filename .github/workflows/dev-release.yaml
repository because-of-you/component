name: Dev Release

on:
  pull_request:
    branches:
      - dev
    paths:
      - charts/**
      - .github/workflows/dev-release.yaml
  push:
    branches:
      - dev
    paths:
      - charts/**
      - .github/workflows/dev-release.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changed-charts:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.detect.outputs.charts }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed charts
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          changed_files="/tmp/changed-files.txt"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            diff_range="$base...$head"
            git diff --name-only "$diff_range" > "$changed_files"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
            diff_range="$base..$head"
            if ! git diff --name-only "$base" "$head" > "$changed_files"; then
              jq -r '.commits[]? | (.added[]?, .modified[]?, .removed[]?)' "$GITHUB_EVENT_PATH" > "$changed_files"
            fi
          else
            base=""
            head="${{ github.sha }}"
            diff_range="all charts"
            find charts -mindepth 1 -maxdepth 1 -type d | sort > /tmp/charts.txt
          fi

          echo "base=$base"
          echo "head=$head"
          echo "diff_range=$diff_range"

          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "changed files:"
            cat "$changed_files"

            awk -F/ '$1 == "charts" && $2 != "" { print "charts/" $2 }' "$changed_files" \
              | sort -u > /tmp/charts.txt
          fi

          mapfile -t charts < <(
            while IFS= read -r chart; do
              if [[ -f "$chart/Chart.yaml" ]]; then
                echo "$chart"
              fi
            done < /tmp/charts.txt
          )

          echo "changed charts:"
          printf '%s\n' "${charts[@]}"

          if [[ "${#charts[@]}" -eq 0 ]]; then
            echo 'charts=[]' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${charts[@]}" \
            | jq -R '{chart: ., name: split("/")[1]}' \
            | jq -s -c '{include: .}' > /tmp/charts.json
          echo "charts=$(cat /tmp/charts.json)" >> "$GITHUB_OUTPUT"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

  lint-and-package:
    needs: changed-charts
    if: needs.changed-charts.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: dev-release-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changed-charts.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.0

      - name: Update chart dependencies
        shell: bash
        run: |
          if grep -q '^dependencies:' "${{ matrix.chart }}/Chart.yaml"; then
            helm dependency update "${{ matrix.chart }}"
          fi

      - name: Lint chart
        run: helm lint "${{ matrix.chart }}"

      - name: Render chart
        run: helm template test "${{ matrix.chart }}" >/dev/null

      - name: Package chart
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          dev_version="0.0.0-dev"

          helm package "${{ matrix.chart }}" \
            --version "$dev_version" \
            --app-version dev \
            --destination dist

          echo "version=$dev_version" >> "$GITHUB_OUTPUT"

      - name: Upload chart package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-dev-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*.tgz

      - name: Login to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push dev chart to OCI
        if: github.event_name == 'push'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if helm push "dist/${{ matrix.name }}-${{ steps.package.outputs.version }}.tgz" \
              "oci://ghcr.io/${{ github.repository_owner }}/charts"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Helm push failed after 3 attempts" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "Helm push attempt $attempt failed; retrying in ${delay}s" >&2
            sleep "$delay"
          done
          {
            echo "### Published ${{ matrix.name }}"
            echo
            echo "\`oci://ghcr.io/${{ github.repository_owner }}/charts/${{ matrix.name }}\`"
            echo
            echo "Version: \`${{ steps.package.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
