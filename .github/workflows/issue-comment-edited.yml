name: Issue Comment Edited - Process Deployment Action

# ========================================
# 当评论被编辑时检查复选框状态并执行相应操作
# ========================================
on:
  issue_comment:
    types: [edited]

jobs:
  process-deployment:
    runs-on: ubuntu-latest
    # 只处理 bot 自己的评论被编辑的情况
    if: |
      github.event.comment.user.login == 'github-actions[bot]' &&
      contains(github.event.comment.body, '🚀 部署配置预览')
    
    steps:
      # ========================================
      # 1. 准备环境
      # ========================================
      - name: 📥 Checkout repository  
        uses: actions/checkout@v3
      
      # ========================================
      # 2. 解析评论内容和复选框状态
      # ========================================
      - name: 🔍 Parse comment and checkboxes
        id: parse
        uses: actions/github-script@v6
        with:
          script: |
            const comment = context.payload.comment.body;
            const issueNumber = context.payload.issue.number;
            
            console.log('========================================');
            console.log('📋 解析评论内容');
            console.log('========================================');
            console.log(`Issue #${issueNumber}`);
            console.log(`Comment ID: ${context.payload.comment.id}`);
            
            // 提取配置 ID
            const configIdMatch = comment.match(/_Config ID: (\d+-\d+)_/);
            const configId = configIdMatch ? configIdMatch[1] : null;
            
            // 检查复选框状态
            const deployChecked = comment.includes('- [x] ✅ **确认部署**') || 
                                comment.includes('- [X] ✅ **确认部署**');
            const cancelChecked = comment.includes('- [x] ❌ **取消部署**') || 
                                comment.includes('- [X] ❌ **取消部署**');
            const updateOnlyChecked = comment.includes('- [x] 🔄 **仅更新配置**') || 
                                     comment.includes('- [X] 🔄 **仅更新配置**');
            
            // 提取 YAML 配置
            const yamlMatch = comment.match(/```yaml\n([\s\S]*?)\n```/);
            const yamlContent = yamlMatch ? yamlMatch[1] : '';
            
            // 提取组件信息
            const componentMatch = comment.match(/- \*\*类型:\*\* `([^`]+)`/);
            const namespaceMatch = comment.match(/- \*\*命名空间:\*\* `([^`]+)`/);
            const deploymentNameMatch = comment.match(/- \*\*名称:\*\* `([^`]+)`/);
            
            const result = {
              configId: configId,
              deployChecked: deployChecked,
              cancelChecked: cancelChecked,
              updateOnlyChecked: updateOnlyChecked,
              yamlContent: yamlContent,
              componentType: componentMatch ? componentMatch[1] : 'unknown',
              namespace: namespaceMatch ? namespaceMatch[1] : 'default',
              deploymentName: deploymentNameMatch ? deploymentNameMatch[1] : 'unknown',
              issueNumber: issueNumber
            };
            
            console.log('解析结果:', JSON.stringify(result, null, 2));
            
            // 设置输出
            core.setOutput('deploy_checked', deployChecked);
            core.setOutput('cancel_checked', cancelChecked);
            core.setOutput('update_only_checked', updateOnlyChecked);
            core.setOutput('config_id', configId);
            core.setOutput('yaml_content', yamlContent);
            core.setOutput('component_type', result.componentType);
            core.setOutput('namespace', result.namespace);
            core.setOutput('deployment_name', result.deploymentName);
            core.setOutput('issue_number', issueNumber);
            
            return result;
      
      # ========================================
      # 3. 处理仅更新配置的情况
      # ========================================
      - name: 🔄 Handle config update only
        if: steps.parse.outputs.update_only_checked == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            console.log('🔄 仅更新配置，不执行部署');
            
            // 重置复选框并更新评论
            const comment = context.payload.comment;
            let newBody = comment.body;
            
            // 重置所有复选框
            newBody = newBody.replace(/- \[x\] ✅ \*\*确认部署\*\*/gi, '- [ ] ✅ **确认部署**');
            newBody = newBody.replace(/- \[x\] ❌ \*\*取消部署\*\*/gi, '- [ ] ❌ **取消部署**');
            newBody = newBody.replace(/- \[x\] 🔄 \*\*仅更新配置\*\*/gi, '- [ ] 🔄 **仅更新配置**');
            
            // 更新时间戳
            newBody = newBody.replace(/_Updated at.*_/g, '');
            newBody += `\n_Updated at ${new Date().toISOString()}_`;
            
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: comment.id,
              body: newBody
            });
            
            // 添加通知评论
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '✅ 配置已更新保存。如需部署，请重新勾选 "确认部署" 选项。'
            });
      
      # ========================================
      # 4. 处理取消部署的情况
      # ========================================
      - name: ❌ Handle deployment cancellation
        if: steps.parse.outputs.cancel_checked == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            console.log('❌ 用户取消部署');
            
            // 添加取消标签
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['deployment-cancelled']
            });
            
            // 移除 pending 标签
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                name: 'pending'
              });
            } catch (e) {
              console.log('移除标签失败:', e.message);
            }
            
            // 添加通知评论
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '❌ 部署已取消。Issue 将被关闭。'
            });
            
            // 关闭 Issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed'
            });
      
      # ========================================
      # 5. 准备部署配置并调用部署工作流
      # ========================================
      - name: 📝 Prepare deployment configuration
        if: steps.parse.outputs.deploy_checked == 'true' || steps.parse.outputs.update_only_checked == 'true'
        id: prepare_config
        run: |
          echo "========================================="
          echo "📝 准备部署配置"
          echo "========================================="
          
          # 保存配置到文件
          cat > /tmp/deployment-values.yaml << 'EOF'
          ${{ steps.parse.outputs.yaml_content }}
          EOF
          
          # Base64 编码配置内容以便传递
          VALUES_BASE64=$(base64 -w 0 /tmp/deployment-values.yaml)
          echo "VALUES_BASE64=$VALUES_BASE64" >> $GITHUB_OUTPUT
          
          # 保存部署元数据
          cat > /tmp/deployment-metadata.json << EOF
          {
            "issue_number": "${{ steps.parse.outputs.issue_number }}",
            "component_type": "${{ steps.parse.outputs.component_type }}",
            "deployment_name": "${{ steps.parse.outputs.deployment_name }}",
            "namespace": "${{ steps.parse.outputs.namespace }}",
            "deployed_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "deployed_by": "${{ github.actor }}",
            "commit_sha": "${{ github.sha }}",
            "workflow_run": "${{ github.run_id }}"
          }
          EOF
          
          echo "✅ 配置准备完成"
      
      # ========================================
      # 6. 触发配置验证（仅更新配置或部署前验证）
      # ========================================
      - name: 🔍 Trigger validation
        if: steps.parse.outputs.update_only_checked == 'true' || steps.parse.outputs.deploy_checked == 'true'
        id: validation_trigger
        uses: actions/github-script@v6
        with:
          script: |
            console.log('🔍 触发配置验证（dry-run）');
            
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-helm-chart.yml',
              ref: context.ref,
              inputs: {
                deployment_name: '${{ steps.parse.outputs.deployment_name }}',
                namespace: '${{ steps.parse.outputs.namespace }}',
                component_type: '${{ steps.parse.outputs.component_type }}',
                values_content: '${{ steps.prepare_config.outputs.VALUES_BASE64 }}',
                issue_number: '${{ steps.parse.outputs.issue_number }}',
                dry_run_only: 'true'
              }
            });
            
            console.log('✅ 已触发配置验证工作流');
            
            // 等待验证工作流开始
            console.log('⏳ 等待验证工作流启动...');
            await new Promise(resolve => setTimeout(resolve, 5000));
            
            // 获取最新的工作流运行
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-helm-chart.yml',
              per_page: 1
            });
            
            if (runs.data.workflow_runs.length > 0) {
              const runId = runs.data.workflow_runs[0].id;
              console.log(`📊 验证工作流 ID: ${runId}`);
              core.setOutput('validation_run_id', runId);
              
              // 等待验证完成（最多等待5分钟）
              const maxAttempts = 30;
              let attempts = 0;
              let status = 'in_progress';
              let conclusion = null;
              
              while (status === 'in_progress' && attempts < maxAttempts) {
                await new Promise(resolve => setTimeout(resolve, 10000));
                
                const run = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId
                });
                
                status = run.data.status;
                conclusion = run.data.conclusion;
                console.log(`⏳ 验证状态: ${status} (尝试 ${attempts + 1}/${maxAttempts})`);
                attempts++;
              }
              console.log(`验证结果: ${conclusion}`);
              core.setOutput('validation_conclusion', conclusion);
              
              if (conclusion !== 'success' && '${{ steps.parse.outputs.deploy_checked }}' === 'true') {
                console.log('❌ 验证失败，取消部署');
                
                // 添加失败评论
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: ${{ steps.parse.outputs.issue_number }},
                  body: `❌ **配置验证失败**\n\n部署已取消。请检查配置并修复错误。\n\n[查看验证日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${runId})`
                });
                
                core.setFailed('配置验证失败，无法继续部署');
              } else if (conclusion === 'success' && '${{ steps.parse.outputs.update_only_checked }}' === 'true') {
                // 仅更新配置时的成功通知
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: ${{ steps.parse.outputs.issue_number }},
                  body: `✅ **配置验证成功**\n\n配置已通过验证，可以安全部署。\n\n如需部署，请勾选"确认部署"选项。`
                });
              }
            }
      
      # ========================================
      # 7. 触发测试部署（验证通过后）
      # ========================================
      - name: 🧪 Trigger test deployment
        if: steps.parse.outputs.deploy_checked == 'true' && steps.validation_trigger.outputs.validation_conclusion == 'success'
        uses: actions/github-script@v6
        with:
          script: |
            console.log('🧪 验证通过，开始生成部署命令');
            
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-helm-chart.yml',
              ref: context.ref,
              inputs: {
                deployment_name: '${{ steps.parse.outputs.deployment_name }}',
                namespace: '${{ steps.parse.outputs.namespace }}',
                component_type: '${{ steps.parse.outputs.component_type }}',
                values_content: '${{ steps.prepare_config.outputs.VALUES_BASE64 }}',
                issue_number: '${{ steps.parse.outputs.issue_number }}',
                dry_run_only: 'false'
              }
            });
            
            console.log('✅ 已触发命令生成工作流');
            
            // 添加评论通知
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.parse.outputs.issue_number }},
              body: '🔍 **配置验证通过**\n\n正在生成部署命令，请稍候...\n\n[查看进度](${{ github.server_url }}/${{ github.repository }}/actions)'
            });
      
      # ========================================
      # 8. 上传配置到 deployment-configs 分支
      # ========================================
      - name: 📤 Upload configuration to deployment-configs
        if: steps.parse.outputs.deploy_checked == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            console.log('========================================');
            console.log('📤 上传配置到 deployment-configs 分支');
            console.log('========================================');
            
            const issueNumber = '${{ steps.parse.outputs.issue_number }}';
            
            // 读取文件内容
            const yamlContent = fs.readFileSync('/tmp/deployment-values.yaml', 'utf8');
            const metadata = JSON.parse(fs.readFileSync('/tmp/deployment-metadata.json', 'utf8'));
            
            try {
              // 获取 main 分支的最新 SHA
              const { data: mainRef } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/${{ github.event.repository.default_branch }}'
              });
              const mainSha = mainRef.object.sha;
              
              // 获取或创建 deployment-configs 分支
              let deployConfigSha;
              let branchExists = true;
              try {
                const { data: ref } = await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: 'heads/deployment-configs'
                });
                deployConfigSha = ref.object.sha;
              } catch (e) {
                // deployment-configs 分支不存在，创建它
                branchExists = false;
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: 'refs/heads/deployment-configs',
                  sha: mainSha
                });
                deployConfigSha = mainSha;
              }
              
              // 如果分支已存在，先合并 main 分支的最新更改
              if (branchExists && deployConfigSha !== mainSha) {
                console.log('🔄 合并 main 分支的最新更改到 deployment-configs');
                
                try {
                  // 创建合并提交
                  const { data: mergeCommit } = await github.rest.git.createCommit({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    message: `🔄 Merge main branch into deployment-configs`,
                    tree: mainSha,
                    parents: [deployConfigSha, mainSha]
                  });
                  
                  // 更新 deployment-configs 分支引用
                  await github.rest.git.updateRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: 'heads/deployment-configs',
                    sha: mergeCommit.sha
                  });
                  
                  deployConfigSha = mergeCommit.sha;
                  console.log('✅ 成功合并 main 分支的更改');
                } catch (mergeError) {
                  console.log('⚠️ 合并失败，使用 main 分支作为基础:', mergeError.message);
                  // 如果合并失败，强制重置到 main 分支
                  await github.rest.git.updateRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: 'heads/deployment-configs',
                    sha: mainSha,
                    force: true
                  });
                  deployConfigSha = mainSha;
                }
              }
              
              // 创建文件内容
              const files = [
                {
                  path: `configs/${issueNumber}/values.yaml`,
                  content: yamlContent
                },
                {
                  path: `configs/${issueNumber}/metadata.json`,
                  content: JSON.stringify(metadata, null, 2)
                }
              ];
              
              // 获取当前树
              const { data: baseTree } = await github.rest.git.getTree({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tree_sha: deployConfigSha,
                recursive: true
              });
              
              // 创建 blobs
              const blobs = await Promise.all(files.map(async file => {
                const { data: blob } = await github.rest.git.createBlob({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  content: Buffer.from(file.content).toString('base64'),
                  encoding: 'base64'
                });
                return {
                  path: file.path,
                  mode: '100644',
                  type: 'blob',
                  sha: blob.sha
                };
              }));
              
              // 创建树
              const { data: tree } = await github.rest.git.createTree({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base_tree: baseTree.sha,
                tree: blobs
              });
              
              // 创建提交
              const { data: commit } = await github.rest.git.createCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                message: `📦 Upload deployment config for issue #${issueNumber}`,
                tree: tree.sha,
                parents: [deployConfigSha]
              });
              
              // 更新引用
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/deployment-configs',
                sha: commit.sha
              });
              
              console.log(`✅ 配置已上传到 deployment-configs 分支`);
              console.log(`📁 路径: configs/${issueNumber}/`);
              
            } catch (error) {
              console.error('上传配置失败:', error);
              core.setFailed(error.message);
            }
      
      # ========================================
      # 9. 更新部署状态
      # ========================================  
      - name: 📢 Update deployment status
        if: steps.parse.outputs.deploy_checked == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            
            // 更新标签
            if (success) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ['deployed-successfully']
              });
            } else {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ['deployment-failed']
              });
            }
            
            // 移除 pending 标签
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                name: 'pending'
              });
            } catch (e) {
              console.log('移除标签失败:', e.message);
            }
            
            // 添加状态评论
            const configUrl = 'https://component.acitrus.cn/deployments/${{ steps.parse.outputs.issue_number }}/';
            const statusMessage = success
              ? `✅ **部署成功！**\n\n组件 \`${{ steps.parse.outputs.component_type }}\` 已成功部署到 \`${{ steps.parse.outputs.namespace }}\` 命名空间。\n\n📎 **配置文件**: [${configUrl}](${configUrl})\n📥 **下载 values.yaml**: [${configUrl}values.yaml](${configUrl}values.yaml)\n📝 **部署日志**: [查看日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
              : `❌ **部署失败！**\n\n请检查[部署日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})了解详细错误信息。`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: statusMessage
            });
            
            // 如果成功，关闭 Issue
            if (success) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }