name: Deploy Dev

on:
  push:
    branches:
      - dev
    paths:
      - 'charts/redis/**'
      - 'charts/postgresql/**'
      - 'charts/traefik/**'
      - 'environments/dev/redis/**'
      - 'environments/dev/postgresql/**'
      - 'environments/dev/traefik/**'
      - 'environments/dev/values.yaml'
      - 'helmfile.yaml'
      - '.github/workflows/deploy-dev.yaml'
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        required: true
        type: choice
        options:
          - redis
          - postgresql
          - traefik

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      components: ${{ github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.component) || steps.filter.outputs.changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed components
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            redis:
              - 'charts/redis/**'
              - 'environments/dev/redis/**'
              - 'environments/dev/values.yaml'
              - 'helmfile.yaml'
              - '.github/workflows/deploy-dev.yaml'
            postgresql:
              - 'charts/postgresql/**'
              - 'environments/dev/postgresql/**'
              - 'environments/dev/values.yaml'
              - 'helmfile.yaml'
              - '.github/workflows/deploy-dev.yaml'
            traefik:
              - 'charts/traefik/**'
              - 'environments/dev/traefik/**'
              - 'environments/dev/values.yaml'
              - 'helmfile.yaml'
              - '.github/workflows/deploy-dev.yaml'

  deploy:
    needs: changes
    if: needs.changes.outputs.components != '' && needs.changes.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    concurrency:
      group: deploy-dev-${{ matrix.component }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helmfile
        uses: mamezou-tech/setup-helmfile@v2.2.0
        with:
          helmfile-version: v1.7.1

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-deploy
          ping: ${{ vars.K3S_TAILSCALE_HOST }}

      - name: Set Kubernetes context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Deploy ${{ matrix.component }}
        run: helmfile -e dev --selector name=${{ matrix.component }} sync
