name: Deploy Dev

on:
  push:
    branches:
      - dev
    paths:
      - 'charts/redis/**'
      - 'charts/postgresql/**'
      - 'charts/lldap/**'
      - 'charts/authelia/**'
      - 'charts/claude-code-hub/**'
      - 'charts/traefik/**'
      - 'environments/dev/redis/**'
      - 'environments/dev/postgresql/**'
      - 'environments/dev/lldap/**'
      - 'environments/dev/authelia/**'
      - 'environments/dev/claude-code-hub/**'
      - 'environments/dev/traefik/**'
      - 'environments/dev/values.yaml'
      - 'helmfile.yaml'
      - '.github/scripts/**'
      - '.github/workflows/deploy-dev.yaml'
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        required: true
        type: choice
        options:
          - redis
          - postgresql
          - lldap
          - authelia
          - claude-code-hub
          - traefik

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      components: ${{ github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.component) || steps.filter.outputs.changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed components
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            redis:
              - 'charts/redis/**'
              - 'environments/dev/redis/**'
              - 'environments/dev/values.yaml'
              - 'helmfile.yaml'
              - '.github/scripts/**'
              - '.github/workflows/deploy-dev.yaml'
            postgresql:
              - 'charts/postgresql/**'
              - 'environments/dev/postgresql/**'
              - 'environments/dev/values.yaml'
              - 'helmfile.yaml'
              - '.github/scripts/**'
              - '.github/workflows/deploy-dev.yaml'
            lldap:
              - 'charts/lldap/**'
              - 'environments/dev/lldap/**'
              - 'environments/dev/values.yaml'
              - 'helmfile.yaml'
              - '.github/scripts/**'
              - '.github/workflows/deploy-dev.yaml'
            authelia:
              - 'charts/authelia/**'
              - 'environments/dev/authelia/**'
              - 'environments/dev/values.yaml'
              - 'helmfile.yaml'
              - '.github/scripts/**'
              - '.github/workflows/deploy-dev.yaml'
            claude-code-hub:
              - 'charts/claude-code-hub/**'
              - 'environments/dev/claude-code-hub/**'
              - 'environments/dev/values.yaml'
              - 'helmfile.yaml'
              - '.github/scripts/**'
              - '.github/workflows/deploy-dev.yaml'
            traefik:
              - 'charts/traefik/**'
              - 'environments/dev/traefik/**'
              - 'environments/dev/values.yaml'
              - 'helmfile.yaml'
              - '.github/scripts/**'
              - '.github/workflows/deploy-dev.yaml'

  deploy:
    needs: changes
    if: needs.changes.outputs.components != '' && needs.changes.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    concurrency:
      group: deploy-dev-${{ matrix.component }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helmfile
        uses: mamezou-tech/setup-helmfile@v2.2.0
        with:
          helmfile-version: v1.7.1

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-deploy
          ping: ${{ vars.K3S_TAILSCALE_HOST }}

      - name: Set Kubernetes context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Wait for Kubernetes API
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if kubectl get --raw=/readyz --request-timeout=15s >/dev/null; then
              exit 0
            fi
            if [[ "$attempt" == 6 ]]; then
              echo "Kubernetes API did not become ready after 6 attempts" >&2
              exit 1
            fi
            delay=$((attempt * 2))
            echo "Kubernetes API check $attempt failed; retrying in ${delay}s" >&2
            sleep "$delay"
          done

      - name: Ensure infra namespace
        if: matrix.component == 'redis' || matrix.component == 'postgresql' || matrix.component == 'lldap' || matrix.component == 'authelia'
        run: kubectl create namespace infra --dry-run=client -o yaml | bash .github/scripts/kubectl-apply-retry.sh

      - name: Ensure app namespace
        if: matrix.component == 'claude-code-hub'
        run: kubectl create namespace app --dry-run=client -o yaml | bash .github/scripts/kubectl-apply-retry.sh

      - name: Ensure traefik namespace
        if: matrix.component == 'traefik'
        run: kubectl create namespace traefik --dry-run=client -o yaml | bash .github/scripts/kubectl-apply-retry.sh

      - name: Sync Redis credentials
        if: matrix.component == 'redis'
        shell: bash
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          test -n "$REDIS_PASSWORD"
          printf '%s' "$REDIS_PASSWORD" \
            | kubectl -n infra create secret generic redis-auth \
                --from-file=redis-password=/dev/stdin \
                --dry-run=client -o yaml \
            | bash .github/scripts/kubectl-apply-retry.sh

      - name: Sync PostgreSQL credentials
        if: matrix.component == 'postgresql'
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$POSTGRES_PASSWORD"
          printf '%s' "$POSTGRES_PASSWORD" \
            | kubectl -n infra create secret generic postgresql-auth \
                --from-file=postgres-password=/dev/stdin \
                --dry-run=client -o yaml \
            | bash .github/scripts/kubectl-apply-retry.sh

      - name: Sync LLDAP credentials
        if: matrix.component == 'lldap'
        shell: bash
        env:
          LLDAP_JWT_SECRET: ${{ secrets.LLDAP_JWT_SECRET }}
          LLDAP_KEY_SEED: ${{ secrets.LLDAP_KEY_SEED }}
          LLDAP_ADMIN_PASSWORD: ${{ secrets.LLDAP_ADMIN_PASSWORD }}
          LLDAP_AUTHELIA_PASSWORD: ${{ secrets.LLDAP_AUTHELIA_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$LLDAP_JWT_SECRET"
          test -n "$LLDAP_KEY_SEED"
          test -n "$LLDAP_ADMIN_PASSWORD"
          test -n "$LLDAP_AUTHELIA_PASSWORD"
          test -n "$POSTGRES_PASSWORD"
          umask 077
          credentials_dir="$(mktemp -d)"
          trap 'rm -rf "$credentials_dir"' EXIT
          encoded_postgres_password="$(jq -rn --arg value "$POSTGRES_PASSWORD" '$value|@uri')"
          database_url="postgres://postgres:${encoded_postgres_password}@postgresql.infra.svc.cluster.local:5432/lldap"
          printf '%s' "$LLDAP_JWT_SECRET" > "$credentials_dir/lldap-jwt-secret"
          printf '%s' "$LLDAP_KEY_SEED" > "$credentials_dir/lldap-key-seed"
          printf '%s' 'admin' > "$credentials_dir/lldap-ldap-user-name"
          printf '%s' "$LLDAP_ADMIN_PASSWORD" > "$credentials_dir/lldap-ldap-user-pass"
          printf '%s' 'dc=acitrus,dc=cn' > "$credentials_dir/base-dn"
          printf '%s' "$database_url" > "$credentials_dir/database-url"
          printf '%s' "$LLDAP_AUTHELIA_PASSWORD" > "$credentials_dir/authelia-password"
          kubectl -n infra create secret generic lldap-secrets \
            --from-file=lldap-jwt-secret="$credentials_dir/lldap-jwt-secret" \
            --from-file=lldap-key-seed="$credentials_dir/lldap-key-seed" \
            --from-file=lldap-ldap-user-name="$credentials_dir/lldap-ldap-user-name" \
            --from-file=lldap-ldap-user-pass="$credentials_dir/lldap-ldap-user-pass" \
            --from-file=base-dn="$credentials_dir/base-dn" \
            --from-file=database-url="$credentials_dir/database-url" \
            --from-file=authelia-password="$credentials_dir/authelia-password" \
            --dry-run=client -o yaml \
            | bash .github/scripts/kubectl-apply-retry.sh
          if kubectl -n infra get deployment lldap >/dev/null 2>&1; then
            kubectl -n infra rollout restart deployment/lldap
            kubectl -n infra rollout status deployment/lldap --timeout=300s
          fi

      - name: Sync Authelia credentials
        if: matrix.component == 'authelia'
        shell: bash
        env:
          LLDAP_AUTHELIA_PASSWORD: ${{ secrets.LLDAP_AUTHELIA_PASSWORD }}
          AUTHELIA_SESSION_ENCRYPTION_KEY: ${{ secrets.AUTHELIA_SESSION_ENCRYPTION_KEY }}
          AUTHELIA_STORAGE_ENCRYPTION_KEY: ${{ secrets.AUTHELIA_STORAGE_ENCRYPTION_KEY }}
          AUTHELIA_RESET_PASSWORD_JWT_SECRET: ${{ secrets.AUTHELIA_RESET_PASSWORD_JWT_SECRET }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$LLDAP_AUTHELIA_PASSWORD"
          test -n "$AUTHELIA_SESSION_ENCRYPTION_KEY"
          test -n "$AUTHELIA_STORAGE_ENCRYPTION_KEY"
          test -n "$AUTHELIA_RESET_PASSWORD_JWT_SECRET"
          test -n "$REDIS_PASSWORD"
          test -n "$POSTGRES_PASSWORD"
          umask 077
          credentials_dir="$(mktemp -d)"
          trap 'rm -rf "$credentials_dir"' EXIT
          printf '%s' "$LLDAP_AUTHELIA_PASSWORD" > "$credentials_dir/authentication.ldap.password.txt"
          printf '%s' "$AUTHELIA_SESSION_ENCRYPTION_KEY" > "$credentials_dir/session.encryption.key"
          printf '%s' "$AUTHELIA_STORAGE_ENCRYPTION_KEY" > "$credentials_dir/storage.encryption.key"
          printf '%s' "$AUTHELIA_RESET_PASSWORD_JWT_SECRET" > "$credentials_dir/identity_validation.reset_password.jwt.hmac.key"
          printf '%s' "$REDIS_PASSWORD" > "$credentials_dir/session.redis.password.txt"
          printf '%s' "$POSTGRES_PASSWORD" > "$credentials_dir/storage.postgres.password.txt"
          kubectl -n infra create secret generic authelia-secrets \
            --from-file=authentication.ldap.password.txt="$credentials_dir/authentication.ldap.password.txt" \
            --from-file=session.encryption.key="$credentials_dir/session.encryption.key" \
            --from-file=storage.encryption.key="$credentials_dir/storage.encryption.key" \
            --from-file=identity_validation.reset_password.jwt.hmac.key="$credentials_dir/identity_validation.reset_password.jwt.hmac.key" \
            --from-file=session.redis.password.txt="$credentials_dir/session.redis.password.txt" \
            --from-file=storage.postgres.password.txt="$credentials_dir/storage.postgres.password.txt" \
            --dry-run=client -o yaml \
            | bash .github/scripts/kubectl-apply-retry.sh

      - name: Sync Claude Code Hub credentials
        if: matrix.component == 'claude-code-hub'
        shell: bash
        env:
          CCH_ADMIN_TOKEN: ${{ secrets.CCH_ADMIN_TOKEN }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$CCH_ADMIN_TOKEN"
          test -n "$REDIS_PASSWORD"
          test -n "$POSTGRES_PASSWORD"
          umask 077
          credentials_dir="$(mktemp -d)"
          trap 'rm -rf "$credentials_dir"' EXIT
          encoded_postgres_password="$(jq -rn --arg value "$POSTGRES_PASSWORD" '$value|@uri')"
          encoded_redis_password="$(jq -rn --arg value "$REDIS_PASSWORD" '$value|@uri')"
          dsn="postgres://postgres:${encoded_postgres_password}@postgresql.infra.svc.cluster.local:5432/claude_code_hub"
          redis_url="redis://:${encoded_redis_password}@redis-master.infra.svc.cluster.local:6379/2"
          printf '%s' "$CCH_ADMIN_TOKEN" > "$credentials_dir/admin-token"
          printf '%s' "$dsn" > "$credentials_dir/dsn"
          printf '%s' "$redis_url" > "$credentials_dir/redis-url"
          printf '%s' "$POSTGRES_PASSWORD" > "$credentials_dir/postgres-password"
          kubectl -n app create secret generic claude-code-hub-secrets \
            --from-file=admin-token="$credentials_dir/admin-token" \
            --from-file=dsn="$credentials_dir/dsn" \
            --from-file=redis-url="$credentials_dir/redis-url" \
            --from-file=postgres-password="$credentials_dir/postgres-password" \
            --dry-run=client -o yaml \
            | bash .github/scripts/kubectl-apply-retry.sh
          if kubectl -n app get deployment claude-code-hub >/dev/null 2>&1; then
            kubectl -n app rollout restart deployment/claude-code-hub
            kubectl -n app rollout status deployment/claude-code-hub --timeout=300s
          fi

      - name: Sync Aliyun DNS credentials
        if: matrix.component == 'traefik'
        shell: bash
        env:
          ALIYUN_DNS_KEY: ${{ secrets.ALIYUN_DNS_KEY }}
          ALIYUN_DNS_SECRET: ${{ secrets.ALIYUN_DNS_SECRET }}
        run: |
          test -n "$ALIYUN_DNS_KEY"
          test -n "$ALIYUN_DNS_SECRET"
          umask 077
          credentials_dir="$(mktemp -d)"
          trap 'rm -rf "$credentials_dir"' EXIT
          printf '%s' "$ALIYUN_DNS_KEY" > "$credentials_dir/ALICLOUD_ACCESS_KEY"
          printf '%s' "$ALIYUN_DNS_SECRET" > "$credentials_dir/ALICLOUD_SECRET_KEY"
          kubectl -n traefik create secret generic alidns \
            --from-file=ALICLOUD_ACCESS_KEY="$credentials_dir/ALICLOUD_ACCESS_KEY" \
            --from-file=ALICLOUD_SECRET_KEY="$credentials_dir/ALICLOUD_SECRET_KEY" \
            --dry-run=client -o yaml \
            | bash .github/scripts/kubectl-apply-retry.sh

      - name: Deploy ${{ matrix.component }}
        run: helmfile -e dev --selector name=${{ matrix.component }} sync
