# .github/workflows/deploy.yml
name: rabbitmq-deploy
on:
  push:
    tags:
      - rabbitmq-*.*.*
    branches:
      - rabbitmq-*.*.*

env:
  CHART_VERSION: 15.2.4

jobs:
  deployment:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4

      - name: modify files
        run: |
          export KAFKA_SASL_DEFAULT_USERNAME='${{ secrets.KAFKA_SASL_DEFAULT_USERNAME }}'
          export KAFKA_SASL_DEFAULT_PASSWORD='${{ secrets.KAFKA_SASL_DEFAULT_PASSWORD }}'

          envsubst < charts/rabbitmq/workloads/network/routes/rabbitmq.yaml > charts/rabbitmq/workloads/network/routes/rabbitmq.yaml_replaced
          mv charts/rabbitmq/workloads/network/routes/rabbitmq.yaml_replaced charts/rabbitmq/workloads/network/routes/rabbitmq.yaml

      # https://github.com/marketplace/actions/helm-deploy
      - name: 'rabbitmq'
        uses: vimeda/helm@v1.7.0
        with:
          release: 'rabbitmq'
          namespace: 'default'
          chart: 'bitnami/rabbitmq'
          repo: "https://charts.bitnami.com/bitnami"
          repo-alias: "bitnami"
          token: '${{ github.token }}'
          chart-version: ${{ env.CHART_VERSION}}
          timeout: 30m0s
          value-files: "charts/rabbitmq/sample.yaml"
          values: |
            auth:
              username: admin
            
            extraConfiguration: |
              log.default.level = debug
              # 使用 LDAP 作为认证后端
              auth_backends.1 = ldap
              auth_backends.2 = internal
              
              # LDAP 服务器配置
              auth_ldap.servers.1 = iam-ldap.default
              auth_ldap.port = 389
              auth_ldap.user_dn_pattern = uid=${username},ou=people,dc=acitrus,dc=cn

              # 如果 LDAP 服务器需要绑定用户进行查询
              auth_ldap.dn_lookup.bind_dn = uid=reader,ou=people,dc=acitrus,dc=cn
              auth_ldap.dn_lookup.bind_password = password
              
              
              # 用户搜索配置
              auth_ldap.logger = false
              auth_ldap.vhost_access_query = {constant, true}
              auth_ldap.resource_access_query = {constant, true}
              auth_ldap.topic_access_query = {constant, true}
            
              
              # -----------
              # 启用 OAuth2 认证后端
              # auth_backends.1 = internal
              # auth_backends.2 = rabbit_auth_backend_oauth2
              # auth_backends.2.authn = rabbit_auth_backend_oauth2
              # auth_backends.2.authz = internal
            
              # management.oauth_disable_basic_auth = false
              
              # OAuth2 服务器配置
              # auth_oauth2.resource_server_id = rabbitmq
              # auth_oauth2.issuer = https://auth.acitrus.cn
              # auth_oauth2.jwks_url= https://auth.acitrus.cn/jwks.json
              
              # 管理界面 OAuth2 配置
              # management.oauth_enabled= true
              # management.oauth_client_id = 5dc253dcd7d5f9259e97bf16df231076770988650baf61bae5955bb6dcec2795
              # management.oauth_client_secret= fgYds_r59DSEDCwDkIhLA2UFq8LL.6GRolOtal7ID4Lx6b5qmR3I5MjH1jzM0BMc
              # management.oauth_scopes = openid profile email
              # auth_oauth2.authorization_endpoint = https://auth.acitrus.cn/api/oidc/authorization
              # auth_oauth2.token_endpoint = https://auth.acitrus.cn/api/oidc/token
              # management.oauth2.userinfo_endpoint = https://auth.acitrus.cn/api/oidc/userinfo
              # auth_oauth2.preferred_username_claims.1 = user_name
              # auth_oauth2.preferred_username_claims.2 = name
              # auth_oauth2.preferred_username_claims.3 = preferred_username
              # auth_oauth2.preferred_username_claims.4 = email
            
              # 权限映射规则
              # auth_oauth2.vhost_access_query = {username, [{string, ${username}}]}
              # auth_oauth2.resource_access_query = {username, [{string, ${username}}]}
              # auth_oauth2.topic_access_query = {username, [{string, ${username}}]}
              
              # 用户信息映射（可选）
              

        env:
          KUBECONFIG_FILE: '${{ secrets.KUBECONFIG }}'

      # https://github.com/marketplace/actions/kubernetes-cli-kubectl
      - uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBECONFIG_BASED }}

      - name: Generate kubeconfig
        run: |
          kubectl apply -k charts/rabbitmq/workloads/