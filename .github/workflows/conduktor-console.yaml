# .github/workflows/deploy.yml
name: conduktor-console-deploy
on:
  push:
    tags:
      - conduktor-console-*.*.*
    branches:
      - conduktor-console-*.*.*

env:
  REGISTRY: registry.cn-shenzhen.aliyuncs.com
  TAG: 1.29.1
  CHART_VERSION: 1.14.1

jobs:
  deployment:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4

      - name: modify files
        run: |
          # export TAG=${{ env.TAG }}
          export KAFKA_SASL_DEFAULT_USERNAME='${{ secrets.KAFKA_SASL_DEFAULT_USERNAME }}'
          export KAFKA_SASL_DEFAULT_PASSWORD='${{ secrets.KAFKA_SASL_DEFAULT_PASSWORD }}'
          
          cat images/conduktor/console/Dockerfile
          envsubst < images/conduktor/console/Dockerfile > images/conduktor/console/Dockerfile_replaced
          cat images/conduktor/console/Dockerfile_replaced
          
          cat images/conduktor/console-cortex/Dockerfile
          envsubst < images/conduktor/console-cortex/Dockerfile > images/conduktor/console-cortex/Dockerfile_replaced
          cat images/conduktor/console-cortex/Dockerfile_replaced
          
          envsubst < charts/conduktor/workloads/network/routes/conduktor.yaml > charts/conduktor/workloads/network/routes/conduktor.yaml_replaced
          mv charts/conduktor/workloads/network/routes/conduktor.yaml_replaced charts/conduktor/workloads/network/routes/conduktor.yaml

      # docker 镜像管理模块 ------> 加载docker镜像元数据管理服务
      - name: image-meta-load
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: gravitation/conduktor-console

      # docker 镜像管理模块 ------> 加载docker登陆服务
      - name: registry-login
        uses: docker/login-action@v2
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.ALIYUN_IMAGES_HUB_NAME }}
          password: ${{ secrets.ALIYUN_IMAGES_HUB_PASSWORD }}
          registry: ${{ env.REGISTRY }}

      # docker 镜像管理模块 ------> 加载docker 多平台镜像构建服务
      - name: image-buildx
        uses: docker/setup-buildx-action@v2

      # docker 镜像管理模块 ------> 构建和推送最新的镜像 ,linux/arm64
      - name: console-image-push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: images/conduktor/console/Dockerfile_replaced
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/gravitation/conduktor-console:${{ env.TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: console-context-image-push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: images/conduktor/console-cortex/Dockerfile_replaced
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/gravitation/conduktor-console-cortex:${{ env.TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      # https://github.com/marketplace/actions/kubernetes-cli-kubectl
      - uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBECONFIG_BASED }}

      - name: Generate kubeconfig
        run: |
          kubectl apply -k charts/conduktor/workloads/

      # https://github.com/marketplace/actions/helm-deploy
      - name: 'conduktor'
        uses: vimeda/helm@v1.7.0
        with:
          release: 'console'
          namespace: 'conduktor'
          chart: 'conduktor/console'
          repo: "https://helm.conduktor.io"
          repo-alias: "conduktor"
          token: '${{ github.token }}'
          chart-version: ${{ env.CHART_VERSION }}
          timeout: 30m0s

          values: |
            config:
              organization:
                name: ${{ secrets.DEFAULT_EMAIL }}
            
              admin:
                password: "${{ secrets.DEFAULT_PASSWORD }}"
                email: ${{ secrets.DEFAULT_EMAIL }}
            
              database:
                host: '${{ secrets.DEFAULT_DATABASE_HOST }}'
                port: '${{ secrets.DEFAULT_DATABASE_PORT }}'
                username: '${{ secrets.DEFAULT_DATABASE_USERNAME }}'
                password: '${{ secrets.DEFAULT_DATABASE_PASSWORD }}'
                name: "conduktor"
            
              clusters:
                - id: 'kafka-default'
                  name: 'kafka-default'
                  bootstrapServers: 'kafka.default:9092'
                  icon: kafka
                  properties: |
                    security.protocol=SASL_PLAINTEXT
                    sasl.mechanism=PLAIN
                    sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='${{ secrets.KAFKA_SASL_DEFAULT_USERNAME }}' password='${{ secrets.KAFKA_SASL_DEFAULT_PASSWORD }}';
                
                - id: 'gateway-default'
                  name: 'gateway-default'
                  bootstrapServers: 'gateway-conduktor-internal.conduktor:9092'
                  icon: kafka
                  properties: |
                    security.protocol=SASL_PLAINTEXT
                    sasl.mechanism=PLAIN
                    sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='${{ secrets.KAFKA_SASL_EXTRA_USERNAME }}' password='${{ secrets.KAFKA_SASL_EXTRA_PASSWORD }}';
                
                
            
            platform:
              extraEnvVars:
                - name: TZ
                  value: "Asia/Shanghai"
                - name: CDK_SSO_OAUTH2_0_NAME
                  value: "${{ secrets.DEFAULT_AUTH_HOST }}"
                - name: CDK_SSO_OAUTH2_0_DEFAULT
                  value: "true"
                - name: CDK_SSO_OAUTH2_0_CLIENT-ID
                  value: "${{ secrets.CONDUKTOR_OAUTH2_ID }}"
                - name: CDK_SSO_OAUTH2LOGOUT
                  value: "true"
                - name: CDK_SSO_OAUTH2_0_CLIENT-SECRET
                  value: "${{ secrets.CONDUKTOR_OAUTH2_SECRET }}"
                - name: CDK_SSO_OAUTH2_0_OPENID_ISSUER
                  value: "https://${{ secrets.DEFAULT_AUTH_HOST }}"
            
                - name: RUN_MODE
                  value: "custom"
                - name: CONSOLE_MEMORY_OPTS
                  value: "-XX:+UseContainerSupport -Xmx1700m -Xshareclasses:cacheDir=/tmp/javasharedresources,name=cache -Xtune:virtualized -Xquickstart"
                - name: GOVERNANCE_MEMORY_OPTS
                  value: "-XX:+UseContainerSupport -Xmx512m -Xshareclasses:cacheDir=/tmp/javasharedresources,name=cache -Xtune:virtualized -Xquickstart"
                - name: AUTHENTICATOR_MEMORY_OPTS
                  value: "-XX:+UseContainerSupport -Xmx128m -Xshareclasses:cacheDir=/tmp/javasharedresources,name=cache -Xtune:virtualized -Xquickstart"
            
              image:
                tag: ${{ env.TAG }}
            
            platformCortex:
              image:
                tag: ${{ env.TAG }}

          value-files: "charts/conduktor/console/sample.yaml"
        env:
          KUBECONFIG_FILE: '${{ secrets.KUBECONFIG }}'