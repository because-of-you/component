name: Sync Images

on:
  push:
    branches:
      - dev
    paths:
      - 'images/*/images.yaml'
  workflow_dispatch:
    inputs:
      component:
        description: Component directory name, or all
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: sync-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-images: ${{ steps.matrix.outputs.has-images }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select changed image manifests
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          SELECTED_COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          manifests_file="$(mktemp)"
          trap 'rm -f "$manifests_file"' EXIT

          if [[ "$EVENT_NAME" == "push" ]]; then
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'images/*/images.yaml' \
              | while IFS= read -r manifest; do
                  [[ -f "$manifest" ]] && printf '%s\n' "$manifest"
                done \
              | sort -u > "$manifests_file"
          elif [[ "$SELECTED_COMPONENT" == "all" ]]; then
            find images -mindepth 2 -maxdepth 2 -type f -name images.yaml \
              | sort > "$manifests_file"
          else
            if [[ ! "$SELECTED_COMPONENT" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "Invalid component directory name: $SELECTED_COMPONENT" >&2
              exit 1
            fi
            manifest="images/${SELECTED_COMPONENT}/images.yaml"
            if [[ ! -f "$manifest" ]]; then
              echo "Unknown component or missing image manifest: $manifest" >&2
              exit 1
            fi
            printf '%s\n' "$manifest" > "$manifests_file"
          fi

          mapfile -t manifests < "$manifests_file"
          if (( ${#manifests[@]} == 0 )); then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has-images=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix="$(ruby .github/scripts/build-image-matrix.rb "${manifests[@]}")"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo 'has-images=true' >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    if: needs.prepare.outputs.has-images == 'true'
    name: ${{ matrix.component }} / ${{ matrix.name }}
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mirror image
        uses: ./.github/actions/mirror-container-image
        with:
          source-image: ${{ matrix.source }}
          destination-image: ${{ matrix.destination }}
          destination-registry: ${{ vars.ALIYUN_ACR_REGISTRY }}
          destination-username: ${{ vars.ALIYUN_ACR_USERNAME }}
          destination-password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
