name: Sync Images

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to sync to Aliyun ACR
        required: true
        type: choice
        options:
          - claude-code-hub

permissions:
  contents: read

concurrency:
  group: sync-images-${{ inputs.image }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Resolve Claude Code Hub image
        if: inputs.image == 'claude-code-hub'
        id: claude-code-hub
        shell: bash
        env:
          ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ vars.ALIYUN_ACR_NAMESPACE }}
        run: |
          set -euo pipefail
          test -n "$ALIYUN_ACR_REGISTRY"
          test -n "$ALIYUN_ACR_NAMESPACE"

          rendered_deployment="$(mktemp)"
          trap 'rm -f "$rendered_deployment"' EXIT
          helm template claude-code-hub charts/claude-code-hub \
            --namespace app \
            -f environments/dev/claude-code-hub/values.yaml \
            --show-only templates/deployment.yaml \
            > "$rendered_deployment"

          destination_image="$(sed -n 's/^[[:space:]]*image: "\([^"]*\)"$/\1/p' "$rendered_deployment" | head -n 1)"
          test -n "$destination_image"
          image_tag="${destination_image##*:}"
          expected_image="${ALIYUN_ACR_REGISTRY}/${ALIYUN_ACR_NAMESPACE}/claude-code-hub:${image_tag}"
          if [[ "$destination_image" != "$expected_image" ]]; then
            echo "Rendered image '$destination_image' does not match configured ACR destination '$expected_image'" >&2
            exit 1
          fi

          echo "source-image=ghcr.io/because-of-you/claude-code-hub:${image_tag}" >> "$GITHUB_OUTPUT"
          echo "destination-image=${destination_image}" >> "$GITHUB_OUTPUT"

      - name: Mirror Claude Code Hub image
        if: inputs.image == 'claude-code-hub'
        uses: ./.github/actions/mirror-container-image
        with:
          source-image: ${{ steps.claude-code-hub.outputs.source-image }}
          destination-image: ${{ steps.claude-code-hub.outputs.destination-image }}
          destination-registry: ${{ vars.ALIYUN_ACR_REGISTRY }}
          destination-username: ${{ vars.ALIYUN_ACR_USERNAME }}
          destination-password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
