# .github/workflows/deploy.yml
name: conduktor deploy
on:
  push:
    tags:
      - conduktor-*.*.*
    branches:
      - conduktor-*.*.*

env:
  REGISTRY: registry.cn-shenzhen.aliyuncs.com
  TAG: 1.27.1

jobs:
  deployment:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trunk

      - name: modify files
        run: |
          export TAG=${{ env.TAG }}

      # docker 镜像管理模块 ------> 加载docker镜像元数据管理服务
      - name: image-meta-load
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: gravitation/conduktor-console

      # docker 镜像管理模块 ------> 加载docker登陆服务
      - name: registry-login
        uses: docker/login-action@v2
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.ALIYUN_IMAGES_HUB_NAME }}
          password: ${{ secrets.ALIYUN_IMAGES_HUB_PASSWORD }}
          registry: ${{ env.REGISTRY }}

      # docker 镜像管理模块 ------> 加载docker 多平台镜像构建服务
      - name: image-buildx
        uses: docker/setup-buildx-action@v2

      # docker 镜像管理模块 ------> 构建和推送最新的镜像 ,linux/arm64
      - name: console-image-push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: images/conduktor/console/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: gravitation/conduktor-console:${{ env.TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: console-context-image-push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: images/conduktor/console-cortex/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: gravitation/conduktor-console-cortex:${{ env.TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      # https://github.com/marketplace/actions/kubernetes-cli-kubectl
      - uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBECONFIG_BASED }}

