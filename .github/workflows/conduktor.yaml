# .github/workflows/deploy.yml
name: conduktor deploy
on:
  push:
    tags:
      - conduktor-*.*.*
    branches:
      - conduktor-*.*.*

env:
  REGISTRY: registry.cn-shenzhen.aliyuncs.com
  TAG: 1.27.1

jobs:
  deployment:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4

      - name: modify files
        run: |
          # export TAG=${{ env.TAG }}
          
          cat images/conduktor/console/Dockerfile
          envsubst < images/conduktor/console/Dockerfile > images/conduktor/console/Dockerfile_replaced
          cat images/conduktor/console/Dockerfile_replaced
          
          cat images/conduktor/console-cortex/Dockerfile
          envsubst < images/conduktor/console-cortex/Dockerfile > images/conduktor/console-cortex/Dockerfile_replaced
          cat images/conduktor/console-cortex/Dockerfile_replaced

      # docker 镜像管理模块 ------> 加载docker镜像元数据管理服务
      - name: image-meta-load
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: gravitation/conduktor-console

      # docker 镜像管理模块 ------> 加载docker登陆服务
      - name: registry-login
        uses: docker/login-action@v2
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.ALIYUN_IMAGES_HUB_NAME }}
          password: ${{ secrets.ALIYUN_IMAGES_HUB_PASSWORD }}
          registry: ${{ env.REGISTRY }}

      # docker 镜像管理模块 ------> 加载docker 多平台镜像构建服务
      - name: image-buildx
        uses: docker/setup-buildx-action@v2

      # docker 镜像管理模块 ------> 构建和推送最新的镜像 ,linux/arm64
      - name: console-image-push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: images/conduktor/console/Dockerfile_replaced
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/gravitation/conduktor-console:${{ env.TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: console-context-image-push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: images/conduktor/console-cortex/Dockerfile_replaced
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/gravitation/conduktor-console-cortex:${{ env.TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      # https://github.com/marketplace/actions/kubernetes-cli-kubectl
      - uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBECONFIG_BASED }}

      - name: Generate kubeconfig
        run: |
          kubectl apply -k charts/conduktor/workloads/

      # https://github.com/marketplace/actions/helm-deploy
      - name: 'conduktor'
        uses: vimeda/helm@v1.7.0
        with:
          release: 'console'
          namespace: 'conduktor'
          chart: 'conduktor/console'
          repo: "https://helm.conduktor.io"
          repo-alias: "conduktor"
          token: '${{ github.token }}'
          timeout: 30m0s
          values: |
            config:
              admin:
                password: "${{ secrets.STRONG_PASSWORD }}"
            platform:
              image:
                tag: ${{ env.TAG }}
                extraEnvVars:
                  - name: CDK_SSO_OAUTH2_0_NAME
                    value: "auth.acitrus.cn"
                  - name: CDK_SSO_OAUTH2_0_DEFAULT
                    value: "true"
                  - name: CDK_SSO_OAUTH2_0_CLIENT-ID
                    value: "${{ secrets.CONDUKTOR_OAUTH2_ID }}"
                  - name: CDK_SSO_OAUTH2LOGOUT
                    value: "false"
                  - name: CDK_SSO_OAUTH2_0_CLIENT-SECRET
                    value: "${{ secrets.CONDUKTOR_OAUTH2_SECRET }}"
                  - name: CDK_SSO_OAUTH2_0_OPENID_ISSUER
                    value: "https://auth.acitrus.cn"
                  - name: RUN_MODE
                    value: "custom"
                  - name: CONSOLE_MEMORY_OPTS
                    value: "-XX:+UseContainerSupport -Xmx1700m -Xshareclasses:cacheDir=/tmp/javasharedresources,name=cache -Xtune:virtualized -Xquickstart"
                  - name: GOVERNANCE_MEMORY_OPTS
                    value: "-XX:+UseContainerSupport -Xmx512m -Xshareclasses:cacheDir=/tmp/javasharedresources,name=cache -Xtune:virtualized -Xquickstart"
                  - name: AUTHENTICATOR_MEMORY_OPTS
                    value: "-XX:+UseContainerSupport -Xmx128m -Xshareclasses:cacheDir=/tmp/javasharedresources,name=cache -Xtune:virtualized -Xquickstart"
            platformCortex:
              image:
                tag: ${{ env.TAG }}

          value-files: "charts/conduktor/console/sample.yaml"
        env:
          KUBECONFIG_FILE: '${{ secrets.KUBECONFIG }}'