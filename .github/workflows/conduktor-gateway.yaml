# .github/workflows/deploy.yml
name: conduktor-gateway-deploy
on:
  push:
    tags:
      - conduktor-gateway-*.*.*
    branches:
      - conduktor-gateway-*.*.*

env:
  CHART_VERSION: 3.3.1

jobs:
  deployment:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4

      # https://github.com/marketplace/actions/kubernetes-cli-kubectl
      - uses: tale/kubectl-action@v1
        with:
          base64-kube-config: ${{ secrets.KUBECONFIG_BASED }}

      # https://github.com/marketplace/actions/helm-deploy
      - name: 'gateway'
        uses: vimeda/helm@v1.7.0
        with:
          release: 'gateway'
          namespace: 'conduktor'
          chart: 'conduktor/conduktor-gateway'
          repo: "https://helm.conduktor.io"
          repo-alias: "conduktor"
          token: '${{ github.token }}'
          chart-version: ${{ env.CHART_VERSION }}
          timeout: 30m0s
          value-files: "charts/conduktor/gateway/sample.yaml"
        env:
          KUBECONFIG_FILE: '${{ secrets.KUBECONFIG }}'