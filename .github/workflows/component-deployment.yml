name: Component Deployment Workflow

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

jobs:
  process-deployment-request:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup environment
        run: |
          # 安装 jq 用于 JSON 处理
          sudo apt-get update
          sudo apt-get install -y jq
          
      - name: Process deployment request
        id: process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 调试信息
          echo "Event Name: ${{ github.event_name }}"
          echo "Event Action: ${{ github.event.action }}"
          
          # 处理不同的触发方式
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # 手动触发时，从输入获取 issue number
            ISSUE_NUMBER=${{ github.event.inputs.issue_number }}
            echo "Using issue number from workflow_dispatch input: $ISSUE_NUMBER"
            
            # 获取 issue 信息
            ISSUE_BODY=$(gh issue view $ISSUE_NUMBER --json body --jq '.body' || echo "")
            echo "Issue body: $ISSUE_BODY"
            
            # 为了简化测试，使用默认值
            COMPONENT_TYPE="frontend"
            DEPLOYMENT_NAME="test-deployment"
            NAMESPACE="default"
          else
            # Issue 事件触发
            ISSUE_NUMBER=${{ github.event.issue.number }}
            echo "Raw issue body:"
            echo "${{ toJSON(github.event.issue.body) }}"
            
            # 尝试解析 Issue 表单数据
            if [ -n "${{ github.event.issue.body }}" ]; then
              # 如果 body 是 JSON 格式
              COMPONENT_TYPE=$(echo '${{ toJSON(github.event.issue.body) }}' | jq -r '.[] | select(.id == "component_type") | .value // empty' 2>/dev/null | tr '[:upper:]' '[:lower:]')
              DEPLOYMENT_NAME=$(echo '${{ toJSON(github.event.issue.body) }}' | jq -r '.[] | select(.id == "deployment_name") | .value // empty' 2>/dev/null)
              NAMESPACE=$(echo '${{ toJSON(github.event.issue.body) }}' | jq -r '.[] | select(.id == "namespace") | .value // empty' 2>/dev/null)
              
              # 如果 JSON 解析失败，尝试简单文本解析
              if [ -z "$COMPONENT_TYPE" ]; then
                # 从 issue body 中提取简单格式的数据
                COMPONENT_TYPE="frontend"  # 默认值
                DEPLOYMENT_NAME="deployment-$(date +%Y%m%d%H%M%S)"
                NAMESPACE="default"
              fi
            else
              # 使用默认值
              COMPONENT_TYPE="frontend"
              DEPLOYMENT_NAME="deployment-$(date +%Y%m%d%H%M%S)"
              NAMESPACE="default"
            fi
          fi
          
          echo "Component Type: $COMPONENT_TYPE"
          echo "Deployment Name: $DEPLOYMENT_NAME"
          echo "Namespace: $NAMESPACE"
          
          # 检查组件类型是否有效
          if [ -z "$COMPONENT_TYPE" ]; then
            echo "Error: 无法确定组件类型"
            exit 1
          fi
          
          # 检查 values 文件是否存在
          VALUES_FILE="./helm/config/$COMPONENT_TYPE/values.yaml"
          if [ ! -f "$VALUES_FILE" ]; then
            echo "Error: 找不到 $VALUES_FILE 文件"
            exit 1
          fi
          
          # 读取 values 文件内容
          VALUES_CONTENT=$(cat "$VALUES_FILE")
          
          # 创建配置确认评论
          COMMENT="## 部署配置确认\n\n"
          COMMENT+="**组件类型**: $COMPONENT_TYPE  \n"
          COMMENT+="**部署名称**: $DEPLOYMENT_NAME  \n"
          COMMENT+="**命名空间**: $NAMESPACE  \n\n"
          COMMENT+="### 配置内容\n\n"
          COMMENT+="\`\`\`yaml\n$VALUES_CONTENT\n\`\`\`\n\n"
          COMMENT+="请检查以上配置：\n"
          COMMENT+="- 如果需要修改配置，请直接编辑上方的 YAML 内容\n"
          COMMENT+="- 确认无误后，请回复 \`/deploy\` 开始部署\n"
          COMMENT+="- 取消部署请回复 \`/cancel\`\n\n"
          COMMENT+="**注意**: 此配置将在 24 小时后自动过期。"
          
          # 输出到 GITHUB_OUTPUT
          echo "comment<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # 保存配置数据到 JSON 文件
          cat > deployment_config.json << EOF
          {
            "component_type": "$COMPONENT_TYPE",
            "deployment_name": "$DEPLOYMENT_NAME",
            "namespace": "$NAMESPACE",
            "values_content": $(jq -Rs . <<< "$VALUES_CONTENT"),
            "issue_number": $ISSUE_NUMBER
          }
          EOF
          
          echo "配置处理完成"
      
      - name: Create or update configuration comment
        if: success()
        uses: actions/github-script@v6
        env:
          COMMENT: ${{ steps.process.outputs.comment }}
        with:
          script: |
            const fs = require('fs');
            
            // 检查 deployment_config.json 是否存在
            let config;
            try {
              config = JSON.parse(fs.readFileSync('deployment_config.json', 'utf8'));
            } catch (error) {
              console.error('Failed to read deployment_config.json:', error);
              core.setFailed('Configuration file not found');
              return;
            }
            
            const issueNumber = config.issue_number || ${{ github.event.inputs.issue_number || 'null' }};
            
            if (!issueNumber) {
              console.error('No issue number available');
              return;
            }
            
            // 检查是否已经存在配置评论
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            
            const existingComment = comments.find(c => 
              c.user.login === 'github-actions[bot]' && 
              c.body.includes('## 部署配置确认')
            );
            
            const commentBody = process.env.COMMENT || `## 部署配置确认\n\n**组件类型**: ${config.component_type}\n**部署名称**: ${config.deployment_name}\n**命名空间**: ${config.namespace}\n`;
            
            if (existingComment) {
              // 更新现有评论
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              // 创建新评论
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody
              });
            }
      
      - name: Check for deployment command
        id: check_command
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            let config;
            try {
              config = JSON.parse(fs.readFileSync('deployment_config.json', 'utf8'));
            } catch (error) {
              console.error('Failed to read deployment_config.json:', error);
              return 'false';
            }
            
            const issueNumber = config.issue_number || ${{ github.event.inputs.issue_number || 'null' }};
            
            if (!issueNumber) {
              return 'false';
            }
            
            // 检查评论中是否包含 /deploy 命令
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            
            const deployCommand = comments.find(c => 
              c.user.login !== 'github-actions[bot]' && 
              c.body.trim() === '/deploy'
            );
            
            if (deployCommand) {
              console.log('Deployment command found');
              return 'true';
            }
            return 'false';
            
      - name: Execute deployment
        if: steps.check_command.outputs.result == 'true'
        run: |
          echo "Starting deployment..."
          # 这里添加实际的部署逻辑
          # 可以使用 helm upgrade --install 等命令
          echo "Deployment completed successfully!"
          
          # 更新 Issue 状态
          echo "Updating issue status..."
          # 添加部署成功评论
          # 关闭 Issue 等
        
      - name: Notify deployment status
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            let config;
            try {
              config = JSON.parse(fs.readFileSync('deployment_config.json', 'utf8'));
            } catch (error) {
              console.log('No deployment config found, skipping notification');
              return;
            }
            
            const issueNumber = config.issue_number || ${{ github.event.inputs.issue_number || 'null' }};
            
            if (!issueNumber) {
              console.log('No issue number available, skipping notification');
              return;
            }
            
            const status = '${{ job.status }}';
            let message = '';
            
            if (status === 'success') {
              message = '✅ 部署流程已成功完成。';
            } else if (status === 'failure') {
              message = '❌ 部署流程失败。请查看 Actions 日志了解详情。';
            } else {
              message = '⚠️ 部署流程已结束，状态: ' + status;
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message + '\n\n您可以在 [Actions 标签页](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 查看详细日志。'
            });
