name: Component Deployment Workflow

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

jobs:
  process-deployment-request:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup environment
        run: |
          # 安装 jq 用于 JSON 处理
          sudo apt-get update
          sudo apt-get install -y jq
          
      - name: Process deployment request
        id: process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 调试信息
          echo "Event Name: ${{ github.event_name }}"
          echo "Event Action: ${{ github.event.action }}"
          
          # 解析 Issue 表单数据
          echo "Raw issue body:"
          echo "${{ toJSON(github.event.issue) }}"
          
          # 提取组件类型（使用 jq 解析 JSON）
          COMPONENT_TYPE=$(echo '${{ toJSON(github.event.issue.body) }}' | jq -r '.[] | select(.id == "component_type") | .value // empty' | tr '[:upper:]' '[:lower:]')
          DEPLOYMENT_NAME=$(echo '${{ toJSON(github.event.issue.body) }}' | jq -r '.[] | select(.id == "deployment_name") | .value // empty')
          NAMESPACE=$(echo '${{ toJSON(github.event.issue.body) }}' | jq -r '.[] | select(.id == "namespace") | .value // "default"')
          
          echo "Component Type: $COMPONENT_TYPE"
          echo "Deployment Name: $DEPLOYMENT_NAME"
          echo "Namespace: $NAMESPACE"
          
          # 检查组件类型是否有效
          if [ -z "$COMPONENT_TYPE" ]; then
            echo "Error: 无法确定组件类型"
            exit 1
          fi
          
          # 检查 values 文件是否存在
          VALUES_FILE="./helm/config/$COMPONENT_TYPE/values.yaml"
          if [ ! -f "$VALUES_FILE" ]; then
            echo "Error: 找不到 $VALUES_FILE 文件"
            exit 1
          fi
          
          # 读取 values 文件内容
          VALUES_CONTENT=$(cat "$VALUES_FILE")
          
          # 创建配置确认评论
          COMMENT="## 部署配置确认\n\n"
          COMMENT+="**组件类型**: $COMPONENT_TYPE  \n"
          COMMENT+="**部署名称**: $DEPLOYMENT_NAME  \n"
          COMMENT+="**命名空间**: $NAMESPACE  \n\n"
          COMMENT+="### 配置内容\n\n"
          COMMENT+="\`\`\`yaml\n$VALUES_CONTENT\n\`\`\`\n\n"
          COMMENT+="请检查以上配置：\n"
          COMMENT+="- 如果需要修改配置，请直接编辑上方的 YAML 内容\n"
          COMMENT+="- 确认无误后，请回复 \`/deploy\` 开始部署\n"
          COMMENT+="- 取消部署请回复 \`/cancel\`\n\n"
          COMMENT+="**注意**: 此配置将在 24 小时后自动过期。"
          
          # 输出到 GITHUB_OUTPUT
          echo "comment<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # 保存配置数据到 JSON 文件
          cat > deployment_config.json << EOF
          {
            "component_type": "$COMPONENT_TYPE",
            "deployment_name": "$DEPLOYMENT_NAME",
            "namespace": "$NAMESPACE",
            "values_content": $(jq -Rs . <<< "$VALUES_CONTENT"),
            "issue_number": ${{ github.event.issue.number }}
          }
          EOF
          
          echo "配置处理完成"
      
      - name: Create or update configuration comment
        uses: actions/github-script@v6
        env:
          COMMENT: ${{ steps.process.outputs.comment }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('deployment_config.json', 'utf8'));
            
            // 检查是否已经存在配置评论
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: config.issue_number
            });
            
            const existingComment = comments.find(c => 
              c.user.login === 'github-actions[bot]' && 
              c.body.includes('## 部署配置确认')
            );
            
            if (existingComment) {
              // 更新现有评论
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: process.env.COMMENT
              });
            } else {
              // 创建新评论
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: config.issue_number,
                body: process.env.COMMENT
              });
            }
            const config = JSON.parse(fs.readFileSync('deployment_config.json', 'utf8'));
            
            // 检查评论中是否包含 /deploy 命令
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: config.issue_number
            });
            
            const deployCommand = comments.find(c => 
              c.user.login !== 'github-actions[bot]' && 
              c.body.trim() === '/deploy'
            );
            
            if (deployCommand) {
              console.log('Deployment command found');
              return 'true';
            }
            return 'false';
            
      - name: Execute deployment
        if: steps.check_command.outputs.result == 'true'
        run: |
          echo "Starting deployment..."
          # 这里添加实际的部署逻辑
          # 可以使用 helm upgrade --install 等命令
          echo "Deployment completed successfully!"
          
          # 更新 Issue 状态
          echo "Updating issue status..."
          # 添加部署成功评论
          # 关闭 Issue 等
        
      - name: Notify deployment status
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('deployment_config.json', 'utf8'));
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: config.issue_number,
              body: '部署流程已开始。您可以在 Actions 标签页查看详细日志。'
            });
