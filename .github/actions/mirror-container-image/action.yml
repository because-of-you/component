name: Mirror container image
description: Copy the amd64 and arm64 runtime image between registries

inputs:
  source-image:
    description: Fully qualified source image including tag or digest
    required: true
  destination-image:
    description: Fully qualified destination image including tag or digest
    required: true
  destination-registry:
    description: Destination registry hostname
    required: true
  destination-username:
    description: Destination registry username
    required: true
  destination-password:
    description: Destination registry password
    required: true
  attempts:
    description: Number of copy attempts
    required: false
    default: "3"

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to destination registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.destination-registry }}
        username: ${{ inputs.destination-username }}
        password: ${{ inputs.destination-password }}

    - name: Copy image
      shell: bash
      env:
        SOURCE_IMAGE: ${{ inputs.source-image }}
        DESTINATION_IMAGE: ${{ inputs.destination-image }}
        DESTINATION_REGISTRY: ${{ inputs.destination-registry }}
        COPY_ATTEMPTS: ${{ inputs.attempts }}
      run: |
        set -euo pipefail
        test -n "$SOURCE_IMAGE"
        test -n "$DESTINATION_IMAGE"
        test -n "$DESTINATION_REGISTRY"
        [[ "$COPY_ATTEMPTS" =~ ^[1-9][0-9]*$ ]]
        if [[ "$DESTINATION_IMAGE" != "$DESTINATION_REGISTRY/"* ]]; then
          echo "Destination image '$DESTINATION_IMAGE' is outside registry '$DESTINATION_REGISTRY'" >&2
          exit 1
        fi

        log() {
          printf '[%s] %s\n' "$(date -u +%H:%M:%S)" "$*"
        }
        started=$SECONDS

        # Rebuilding FROM the source pulls only the runtime image for the requested
        # platforms, so the source attestation manifests never reach the mirror.
        # Some registries reject their application/vnd.oci.empty.v1+json configs.
        context="$(mktemp -d)"
        trap 'rm -rf "$context"' EXIT
        printf 'FROM %s\n' "$SOURCE_IMAGE" > "$context/Dockerfile"

        for ((attempt = 1; attempt <= COPY_ATTEMPTS; attempt++)); do
          log "Attempt $attempt/$COPY_ATTEMPTS: copy linux/amd64+linux/arm64 to $DESTINATION_IMAGE"
          copy_started=$SECONDS
          if docker buildx build "$context" \
            --file "$context/Dockerfile" \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            --push \
            --tag "$DESTINATION_IMAGE"; then
            log "Push finished in $((SECONDS - copy_started))s"
            destination_platforms="$(docker buildx imagetools inspect "$DESTINATION_IMAGE" 2>/dev/null || true)"
            if [[ "$destination_platforms" == *linux/amd64* && "$destination_platforms" == *linux/arm64* ]]; then
              log "Mirrored amd64 and arm64 manifests in $((SECONDS - started))s"
              exit 0
            fi
            echo "Destination is missing a runtime platform after push" >&2
          fi
          if [[ "$attempt" == "$COPY_ATTEMPTS" ]]; then
            log "Failed to mirror $SOURCE_IMAGE after $COPY_ATTEMPTS attempts"
            exit 1
          fi
          delay=$((attempt * 5))
          log "Image mirror attempt $attempt failed; retrying in ${delay}s"
          sleep "$delay"
        done
