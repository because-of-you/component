name: Mirror container image
description: Copy amd64 and arm64 runtime images between registries only when their digests change

inputs:
  source-image:
    description: Fully qualified source image including tag or digest
    required: true
  destination-image:
    description: Fully qualified destination image including tag or digest
    required: true
  destination-registry:
    description: Destination registry hostname
    required: true
  destination-username:
    description: Destination registry username
    required: true
  destination-password:
    description: Destination registry password
    required: true
  attempts:
    description: Number of copy attempts
    required: false
    default: "3"

runs:
  using: composite
  steps:
    - name: Install regctl
      uses: regclient/actions/regctl-installer@78eb729dbdb4ef6480e85ff697b4410e22112583
      with:
        release: v0.11.5

    - name: Copy image
      shell: bash
      env:
        SOURCE_IMAGE: ${{ inputs.source-image }}
        DESTINATION_IMAGE: ${{ inputs.destination-image }}
        DESTINATION_REGISTRY: ${{ inputs.destination-registry }}
        DESTINATION_USERNAME: ${{ inputs.destination-username }}
        DESTINATION_PASSWORD: ${{ inputs.destination-password }}
        COPY_ATTEMPTS: ${{ inputs.attempts }}
      run: |
        set -euo pipefail
        test -n "$SOURCE_IMAGE"
        test -n "$DESTINATION_IMAGE"
        test -n "$DESTINATION_REGISTRY"
        test -n "$DESTINATION_USERNAME"
        test -n "$DESTINATION_PASSWORD"
        [[ "$COPY_ATTEMPTS" =~ ^[1-9][0-9]*$ ]]
        if [[ "$DESTINATION_IMAGE" != "$DESTINATION_REGISTRY/"* ]]; then
          echo "Destination image '$DESTINATION_IMAGE' is outside registry '$DESTINATION_REGISTRY'" >&2
          exit 1
        fi

        trap 'regctl registry logout "$DESTINATION_REGISTRY" >/dev/null 2>&1 || true' EXIT
        printf '%s' "$DESTINATION_PASSWORD" \
          | regctl registry login \
              --user "$DESTINATION_USERNAME" \
              --pass-stdin \
              "$DESTINATION_REGISTRY"

        platforms=(linux/amd64 linux/arm64)
        for ((attempt = 1; attempt <= COPY_ATTEMPTS; attempt++)); do
          if ! amd64_digest="$(regctl image digest --platform "${platforms[0]}" "$SOURCE_IMAGE")" \
            || ! arm64_digest="$(regctl image digest --platform "${platforms[1]}" "$SOURCE_IMAGE")" \
            || [[ "$amd64_digest" != sha256:* || "$arm64_digest" != sha256:* ]]; then
            echo "Failed to resolve amd64/arm64 source digests" >&2
            mirror_valid=false
          else
            echo "Source amd64 digest: $amd64_digest"
            echo "Source arm64 digest: $arm64_digest"
            if regctl index create "$DESTINATION_IMAGE" \
              --ref "$SOURCE_IMAGE@$amd64_digest" \
              --ref "$SOURCE_IMAGE@$arm64_digest"; then
              if ! destination_amd64_digest="$(regctl image digest --platform "${platforms[0]}" "$DESTINATION_IMAGE")" \
                || ! destination_arm64_digest="$(regctl image digest --platform "${platforms[1]}" "$DESTINATION_IMAGE")"; then
                mirror_valid=false
              elif [[ "$amd64_digest" == "$destination_amd64_digest" \
                && "$arm64_digest" == "$destination_arm64_digest" ]]; then
                mirror_valid=true
              else
                mirror_valid=false
              fi
            else
              mirror_valid=false
            fi
          fi
          if [[ "$mirror_valid" == true ]]; then
            echo "Mirrored and verified amd64 and arm64 manifests"
            exit 0
          fi
          if [[ "$attempt" == "$COPY_ATTEMPTS" ]]; then
            echo "Failed to mirror $SOURCE_IMAGE after $COPY_ATTEMPTS attempts" >&2
            exit 1
          fi
          delay=$((attempt * 5))
          echo "Image mirror attempt $attempt failed; retrying in ${delay}s" >&2
          sleep "$delay"
        done
