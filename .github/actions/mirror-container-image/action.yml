name: Mirror container image
description: Copy a container image between registries only when its digest changes

inputs:
  source-image:
    description: Fully qualified source image including tag or digest
    required: true
  destination-image:
    description: Fully qualified destination image including tag or digest
    required: true
  destination-registry:
    description: Destination registry hostname
    required: true
  destination-username:
    description: Destination registry username
    required: true
  destination-password:
    description: Destination registry password
    required: true
  attempts:
    description: Number of copy attempts
    required: false
    default: "3"

runs:
  using: composite
  steps:
    - name: Install skopeo
      shell: bash
      run: |
        if ! command -v skopeo >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
        fi

    - name: Copy image
      shell: bash
      env:
        SOURCE_IMAGE: ${{ inputs.source-image }}
        DESTINATION_IMAGE: ${{ inputs.destination-image }}
        DESTINATION_REGISTRY: ${{ inputs.destination-registry }}
        DESTINATION_USERNAME: ${{ inputs.destination-username }}
        DESTINATION_PASSWORD: ${{ inputs.destination-password }}
        COPY_ATTEMPTS: ${{ inputs.attempts }}
      run: |
        set -euo pipefail
        test -n "$SOURCE_IMAGE"
        test -n "$DESTINATION_IMAGE"
        test -n "$DESTINATION_REGISTRY"
        test -n "$DESTINATION_USERNAME"
        test -n "$DESTINATION_PASSWORD"
        [[ "$COPY_ATTEMPTS" =~ ^[1-9][0-9]*$ ]]
        if [[ "$DESTINATION_IMAGE" != "$DESTINATION_REGISTRY/"* ]]; then
          echo "Destination image '$DESTINATION_IMAGE' is outside registry '$DESTINATION_REGISTRY'" >&2
          exit 1
        fi

        trap 'skopeo logout "$DESTINATION_REGISTRY" >/dev/null 2>&1 || true' EXIT
        printf '%s' "$DESTINATION_PASSWORD" \
          | skopeo login \
              --username "$DESTINATION_USERNAME" \
              --password-stdin \
              "$DESTINATION_REGISTRY"

        source_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${SOURCE_IMAGE}")"
        destination_digest=""
        if destination_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${DESTINATION_IMAGE}" 2>/dev/null)" \
          && [[ "$source_digest" == "$destination_digest" ]]; then
          echo "Image already mirrored with digest ${source_digest}; skipping copy"
          exit 0
        fi

        if [[ -n "$destination_digest" ]]; then
          echo "Image digest changed (${destination_digest} -> ${source_digest}); updating mirror"
        else
          echo "Destination image does not exist; creating mirror for digest ${source_digest}"
        fi

        for ((attempt = 1; attempt <= COPY_ATTEMPTS; attempt++)); do
          if skopeo copy --all "docker://${SOURCE_IMAGE}" "docker://${DESTINATION_IMAGE}"; then
            exit 0
          fi
          if [[ "$attempt" == "$COPY_ATTEMPTS" ]]; then
            echo "Failed to mirror $SOURCE_IMAGE after $COPY_ATTEMPTS attempts" >&2
            exit 1
          fi
          delay=$((attempt * 5))
          echo "Image mirror attempt $attempt failed; retrying in ${delay}s" >&2
          sleep "$delay"
        done
