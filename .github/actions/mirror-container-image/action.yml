name: Mirror container image
description: Copy amd64 and arm64 runtime images between registries only when their digests change

inputs:
  source-image:
    description: Fully qualified source image including tag or digest
    required: true
  destination-image:
    description: Fully qualified destination image including tag or digest
    required: true
  destination-registry:
    description: Destination registry hostname
    required: true
  destination-username:
    description: Destination registry username
    required: true
  destination-password:
    description: Destination registry password
    required: true
  attempts:
    description: Number of copy attempts
    required: false
    default: "3"

runs:
  using: composite
  steps:
    - name: Install regctl
      uses: regclient/actions/regctl-installer@78eb729dbdb4ef6480e85ff697b4410e22112583
      with:
        release: v0.11.5

    - name: Copy image
      shell: bash
      env:
        SOURCE_IMAGE: ${{ inputs.source-image }}
        DESTINATION_IMAGE: ${{ inputs.destination-image }}
        DESTINATION_REGISTRY: ${{ inputs.destination-registry }}
        DESTINATION_USERNAME: ${{ inputs.destination-username }}
        DESTINATION_PASSWORD: ${{ inputs.destination-password }}
        COPY_ATTEMPTS: ${{ inputs.attempts }}
      run: |
        set -euo pipefail
        test -n "$SOURCE_IMAGE"
        test -n "$DESTINATION_IMAGE"
        test -n "$DESTINATION_REGISTRY"
        test -n "$DESTINATION_USERNAME"
        test -n "$DESTINATION_PASSWORD"
        [[ "$COPY_ATTEMPTS" =~ ^[1-9][0-9]*$ ]]
        if [[ "$DESTINATION_IMAGE" != "$DESTINATION_REGISTRY/"* ]]; then
          echo "Destination image '$DESTINATION_IMAGE' is outside registry '$DESTINATION_REGISTRY'" >&2
          exit 1
        fi

        # BuildKit adds attestation manifests as unknown/unknown platforms. Some
        # registries reject their application/vnd.oci.empty.v1+json configs, so
        # mirror only the runtime platforms used by this repository.
        platforms=(linux/amd64 linux/arm64)

        trap 'regctl registry logout "$DESTINATION_REGISTRY" >/dev/null 2>&1 || true' EXIT
        printf '%s' "$DESTINATION_PASSWORD" \
          | regctl registry login \
              --user "$DESTINATION_USERNAME" \
              --pass-stdin \
              "$DESTINATION_REGISTRY"

        source_digests=()
        destination_digests=()
        destination_complete=true
        for platform in "${platforms[@]}"; do
          source_digests+=("$(regctl image digest --platform "$platform" "$SOURCE_IMAGE")")
          if destination_digest="$(regctl image digest --platform "$platform" "$DESTINATION_IMAGE" 2>/dev/null)"; then
            destination_digests+=("$destination_digest")
          else
            destination_complete=false
            destination_digests+=(missing)
          fi
        done

        if [[ "$destination_complete" == true ]] \
          && [[ "${source_digests[*]}" == "${destination_digests[*]}" ]]; then
          echo "Runtime images already mirrored; skipping copy"
          exit 0
        fi

        if [[ "$destination_complete" == true ]]; then
          echo "Runtime image digest changed; updating mirror"
        else
          echo "Destination runtime image is incomplete or missing; creating mirror"
        fi

        for ((attempt = 1; attempt <= COPY_ATTEMPTS; attempt++)); do
          if regctl index create "$DESTINATION_IMAGE" \
            --ref "$SOURCE_IMAGE" \
            --platform linux/amd64 \
            --platform linux/arm64; then
            mirror_valid=true
            for i in "${!platforms[@]}"; do
              destination_digest="$(
                regctl image digest \
                  --platform "${platforms[$i]}" \
                  "$DESTINATION_IMAGE" 2>/dev/null || true
              )"
              if [[ "${source_digests[$i]}" != "$destination_digest" ]]; then
                echo "Digest verification failed for ${platforms[$i]}" >&2
                mirror_valid=false
              fi
            done
            if [[ "$mirror_valid" == true ]]; then
              echo "Mirrored runtime platforms: ${platforms[*]}"
              exit 0
            fi
          fi
          if [[ "$attempt" == "$COPY_ATTEMPTS" ]]; then
            echo "Failed to mirror $SOURCE_IMAGE after $COPY_ATTEMPTS attempts" >&2
            exit 1
          fi
          delay=$((attempt * 5))
          echo "Image mirror attempt $attempt failed; retrying in ${delay}s" >&2
          sleep "$delay"
        done
