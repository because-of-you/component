name: Mirror container image
description: Copy amd64 and arm64 runtime images between registries only when their digests change

inputs:
  source-image:
    description: Fully qualified source image including tag or digest
    required: true
  destination-image:
    description: Fully qualified destination image including tag or digest
    required: true
  destination-registry:
    description: Destination registry hostname
    required: true
  destination-username:
    description: Destination registry username
    required: true
  destination-password:
    description: Destination registry password
    required: true
  attempts:
    description: Number of copy attempts
    required: false
    default: "3"

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to destination registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.destination-registry }}
        username: ${{ inputs.destination-username }}
        password: ${{ inputs.destination-password }}

    - name: Copy image
      shell: bash
      env:
        SOURCE_IMAGE: ${{ inputs.source-image }}
        DESTINATION_IMAGE: ${{ inputs.destination-image }}
        DESTINATION_REGISTRY: ${{ inputs.destination-registry }}
        COPY_ATTEMPTS: ${{ inputs.attempts }}
      run: |
        set -euo pipefail
        test -n "$SOURCE_IMAGE"
        test -n "$DESTINATION_IMAGE"
        test -n "$DESTINATION_REGISTRY"
        [[ "$COPY_ATTEMPTS" =~ ^[1-9][0-9]*$ ]]
        if [[ "$DESTINATION_IMAGE" != "$DESTINATION_REGISTRY/"* ]]; then
          echo "Destination image '$DESTINATION_IMAGE' is outside registry '$DESTINATION_REGISTRY'" >&2
          exit 1
        fi

        log() {
          printf '[%s] %s\n' "$(date -u +%H:%M:%S)" "$*"
        }
        started=$SECONDS

        platform_digest() {
          docker buildx imagetools inspect --raw "$1" \
            | jq -r --arg platform "$2" \
                '.manifests[] | select("\(.platform.os)/\(.platform.architecture)" == $platform) | .digest' \
            | head -1
        }

        for ((attempt = 1; attempt <= COPY_ATTEMPTS; attempt++)); do
          log "Attempt $attempt/$COPY_ATTEMPTS: resolve source digests"
          amd64_digest="$(platform_digest "$SOURCE_IMAGE" linux/amd64 || true)"
          arm64_digest="$(platform_digest "$SOURCE_IMAGE" linux/arm64 || true)"
          if [[ "$amd64_digest" != sha256:* || "$arm64_digest" != sha256:* ]]; then
            echo "Failed to resolve amd64/arm64 source digests" >&2
            mirror_valid=false
          else
            log "Source amd64 digest: $amd64_digest"
            log "Source arm64 digest: $arm64_digest"
            log "Copy amd64+arm64 blobs to $DESTINATION_IMAGE (slow cross-registry transfer)"
            copy_started=$SECONDS
            if docker buildx imagetools create \
              --tag "$DESTINATION_IMAGE" \
              "$SOURCE_IMAGE@$amd64_digest" \
              "$SOURCE_IMAGE@$arm64_digest"; then
              log "Blob transfer finished in $((SECONDS - copy_started))s"
              destination_amd64_digest="$(platform_digest "$DESTINATION_IMAGE" linux/amd64 || true)"
              destination_arm64_digest="$(platform_digest "$DESTINATION_IMAGE" linux/arm64 || true)"
              if [[ "$amd64_digest" == "$destination_amd64_digest" \
                && "$arm64_digest" == "$destination_arm64_digest" ]]; then
                mirror_valid=true
              else
                echo "Destination digests do not match the source" >&2
                mirror_valid=false
              fi
            else
              mirror_valid=false
            fi
          fi
          if [[ "$mirror_valid" == true ]]; then
            log "Mirrored and verified amd64 and arm64 manifests in $((SECONDS - started))s"
            exit 0
          fi
          if [[ "$attempt" == "$COPY_ATTEMPTS" ]]; then
            log "Failed to mirror $SOURCE_IMAGE after $COPY_ATTEMPTS attempts"
            exit 1
          fi
          delay=$((attempt * 5))
          log "Image mirror attempt $attempt failed; retrying in ${delay}s"
          sleep "$delay"
        done
