dashboard:
  enabled: true

ingress-controller:
  enabled: true
  config:
    apisix:
      serviceNamespace: gateway

resources:
  requests:
    cpu: 10m
    ephemeral-storage: 50Mi
    memory: 100Mi
  limits:
    cpu: 1000m
    ephemeral-storage: 2Gi
    memory: 1024Mi


service:
  type: LoadBalancer
  stream:
    enabled: true
    tcp:
      - addr: 8888
        tls: true

apisix:
  ssl:
    enabled: true
    containerPort: 443

etcd:
  persistence:
    size: 1Gi


timezone: "Asia/Shanghai"