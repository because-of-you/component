dashboard:
  enabled: false

image:
  registry: registry.cn-shenzhen.aliyuncs.com
  repository: gravitation/apisix
  tag: 3.9.1-debian-12-r8

controlPlane:
  resources:
    requests:
      cpu: 10m
      ephemeral-storage: 50Mi
      memory: 256Mi
    limits:
      cpu: 1000m
      ephemeral-storage: 2Gi
      memory: 1024Mi

dataPlane:
  containerPorts:
    http: 80
    https: 443
  resources:
    requests:
      cpu: 10m
      ephemeral-storage: 50Mi
      memory: 100Mi
    limits:
      cpu: 1000m
      ephemeral-storage: 2Gi
      memory: 1024Mi

ingressController:
  image:
    registry: registry.cn-shenzhen.aliyuncs.com
    repository: gravitation/apisix-ingress-controller
    tag: 1.8.2-debian-12-r11
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      cpu: 1000m
      memory: 512Mi

waitContainer:
  image:
    registry: registry.cn-shenzhen.aliyuncs.com
    repository: gravitation/os-shell
    tag: 12-debian-12-r27

etcd:
  image:
    registry: registry.cn-shenzhen.aliyuncs.com
    repository: gravitation/etcd
    tag: 3.5.15-debian-12-r4
  resources:
    limits:
      cpu: 500m
      ephemeral-storage: 2Gi
      memory: 500Mi
    requests:
      cpu: 10m
      ephemeral-storage: 50Mi
      memory: 256Mi