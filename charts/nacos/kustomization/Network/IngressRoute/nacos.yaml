apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nacos.acitrus.cn
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    gethomepage.dev/href: "https://nacos.acitrus.cn"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: nacos
    gethomepage.dev/group: Other
    # gethomepage.dev/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/homepage.png
    gethomepage.dev/name: nacos
    #    gethomepage.dev/widget.type: "emby"
    #    gethomepage.dev/widget.url: "https://home.acitrus.cn"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=rnacos"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # https://doc.traefik.io/traefik/middlewares/overview/
    - kind: Rule
      match: Host(`nacos.acitrus.cn`)
      services:
        - kind: Service
          name: rnacos
          port: 8848
          sticky:
            cookie:
              httpOnly: true
              secure: true
              sameSite: none
      middlewares:
        - name: http-to-https
        - name: 'forwardauth-authelia' # name of your middleware, as defined in your middleware.yml
          namespace: 'default'