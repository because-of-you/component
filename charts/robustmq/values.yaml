replicaCount: 1

image:
  repository: ghcr.io/robustmq/robustmq
  tag: v0.4.11
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

config:
  clusterName: broker-server
  brokerId: 1
  brokerIp: 127.0.0.1
  dataPath: /robustmq/data/meta
  logPath: /robustmq/data/logs
  storagePort: 1778
  storageDataPaths:
    - /robustmq/data/engine

# RobustMQ's packaged Dashboard falls back to http://localhost:58080 when its
# runtime API URL is unset. Set this to the public, browser-reachable origin
# when the admin endpoint is published behind a reverse proxy.
dashboard:
  apiBaseUrl: ""

service:
  type: ClusterIP
  annotations: {}
  ports:
    admin: 58080
    mqtt: 1883
    mqttTls: 1885
    mqttWebSocket: 8083
    mqttWebSocketTls: 8085
    kafka: 9092
    grpc: 1228
    amqp: 5672
    nats: 4222

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

ingressRoute:
  enabled: false
  host: ""
  entryPoints:
    - websecure
  middlewares: []
  tls: {}

mqttIngressRoute:
  enabled: false
  host: ""
  entryPoints:
    - gravitation
  tls: {}

amqpIngressRoute:
  enabled: false
  host: ""
  entryPoints:
    - gravitation
  tls: {}

startupProbe:
  enabled: true
  failureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 6

podDisruptionBudget:
  enabled: false
  minAvailable: 1

resources:
  requests:
    cpu: 20m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 2Gi

extraEnv: []
nodeSelector: {}
tolerations: []
affinity: {}
