{{- if .Values.mqttIngressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "robustmq.fullname" . }}-mqtt
  labels:
    {{- include "robustmq.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.mqttIngressRoute.entryPoints | nindent 4 }}
  routes:
    - match: HostSNI(`{{ required "mqttIngressRoute.host is required when mqttIngressRoute is enabled" .Values.mqttIngressRoute.host }}`)
      services:
        - name: {{ include "robustmq.fullname" . }}
          port: mqtt
  tls:
    {{- toYaml .Values.mqttIngressRoute.tls | nindent 4 }}
{{- end }}
{{- if .Values.amqpIngressRoute.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "robustmq.fullname" . }}-amqp
  labels:
    {{- include "robustmq.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.amqpIngressRoute.entryPoints | nindent 4 }}
  routes:
    - match: HostSNI(`{{ required "amqpIngressRoute.host is required when amqpIngressRoute is enabled" .Values.amqpIngressRoute.host }}`)
      services:
        - name: {{ include "robustmq.fullname" . }}
          port: amqp
  tls:
    {{- toYaml .Values.amqpIngressRoute.tls | nindent 4 }}
{{- end }}
