{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "dbx.fullname" . }}
  labels:
    {{- include "dbx.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: 'Host(`{{ required "ingressRoute.host is required when ingressRoute is enabled" .Values.ingressRoute.host }}`)'
      middlewares:
        {{- range .Values.ingressRoute.middlewares }}
        - name: {{ .name | quote }}
          {{- with .namespace }}
          namespace: {{ . | quote }}
          {{- end }}
        {{- end }}
      services:
        - name: {{ include "dbx.fullname" . }}
          port: {{ .Values.service.port }}
  {{- with .Values.ingressRoute.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
