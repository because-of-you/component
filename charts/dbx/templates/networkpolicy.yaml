{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dbx.fullname" . }}
  labels:
    {{- include "dbx.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dbx.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
      ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
{{- end }}
