apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: conduktor-gateway-kafka
  labels:
    app.kubernetes.io/name: conduktor-gateway
    app.kubernetes.io/component: kafka
spec:
  entryPoints:
    - gravitation
  routes:
    - match: HostSNI(`kafka.tcp.acitrus.cn`)
      services:
        - name: {{ include "conduktor-gateway.wrapperName" . }}
          port: 1024
  tls:
    passthrough: true
