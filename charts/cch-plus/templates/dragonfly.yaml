{{- if .Values.dragonfly.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.dragonfly.service.name }}
  namespace: {{ include "cch-plus.namespace" . }}
  labels:
    {{- include "cch-plus.labels" . | nindent 4 }}
    app.kubernetes.io/component: dragonfly
spec:
  serviceName: {{ .Values.dragonfly.service.name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.dragonfly.service.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.dragonfly.service.name }}
        app.kubernetes.io/component: dragonfly
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dragonfly
          image: "{{ .Values.dragonfly.image.repository }}:{{ .Values.dragonfly.image.tag }}"
          imagePullPolicy: {{ .Values.dragonfly.image.pullPolicy }}
          args:
            - --proactor_threads={{ .Values.dragonfly.proactorThreads }}
            - --maxmemory={{ .Values.dragonfly.maxMemory }}
            - --dir=/data
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.dragonfly.resources | nindent 12 }}
          securityContext:
            {{- include "cch-plus.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "cch-plus.labels" . | nindent 10 }}
          app.kubernetes.io/component: dragonfly
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.dragonfly.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.dragonfly.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.dragonfly.service.name }}
  namespace: {{ include "cch-plus.namespace" . }}
  labels:
    {{- include "cch-plus.labels" . | nindent 4 }}
    app.kubernetes.io/component: dragonfly
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.dragonfly.service.name }}
  ports:
    - name: redis
      port: {{ .Values.dragonfly.service.port }}
      targetPort: redis
      protocol: TCP
{{- end }}
