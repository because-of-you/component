{{- if .Values.rabbitmqIngress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ .Values.rabbitmqIngress.name | quote }}
spec:
  entryPoints:
    {{- toYaml .Values.rabbitmqIngress.entryPoints | nindent 4 }}
  routes:
    - match: HostSNI(`{{ .Values.rabbitmqIngress.host }}`)
      services:
        - name: {{ .Values.rabbitmqIngress.service.name | quote }}
          port: {{ .Values.rabbitmqIngress.service.port }}
  {{- with .Values.rabbitmqIngress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rabbitmqUiIngress.enabled }}
---
{{- if .Values.rabbitmqUiIngress.redirectToHttps.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.rabbitmqUiIngress.redirectToHttps.name | quote }}
spec:
  redirectScheme:
    scheme: https
    permanent: {{ .Values.rabbitmqUiIngress.redirectToHttps.permanent }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.rabbitmqUiIngress.redirectToHttps.ingressRouteName | quote }}
spec:
  entryPoints:
    {{- toYaml .Values.rabbitmqUiIngress.redirectToHttps.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.rabbitmqUiIngress.host }}`)
      kind: Rule
      middlewares:
        - name: {{ .Values.rabbitmqUiIngress.redirectToHttps.name | quote }}
      services:
        - name: {{ .Values.rabbitmqUiIngress.service.name | quote }}
          port: {{ .Values.rabbitmqUiIngress.service.port }}
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.rabbitmqUiIngress.name | quote }}
spec:
  entryPoints:
    {{- toYaml .Values.rabbitmqUiIngress.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.rabbitmqUiIngress.host }}`)
      kind: Rule
      services:
        - name: {{ .Values.rabbitmqUiIngress.service.name | quote }}
          port: {{ .Values.rabbitmqUiIngress.service.port }}
  {{- with .Values.rabbitmqUiIngress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
