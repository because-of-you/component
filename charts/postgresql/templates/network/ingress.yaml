{{- if .Values.postgresqlIngress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ .Values.postgresqlIngress.name | quote }}
spec:
  entryPoints:
    {{- toYaml .Values.postgresqlIngress.entryPoints | nindent 4 }}
  routes:
    - match: HostSNI(`{{ .Values.postgresqlIngress.host }}`)
      services:
        - name: {{ .Values.postgresqlIngress.service.name | quote }}
          port: {{ .Values.postgresqlIngress.service.port }}
  {{- with .Values.postgresqlIngress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
