postgresqlIngress:
  enabled: false
  name: postgresql-ingress-route-tcp
  host: ""
  entryPoints: []
  service:
    name: postgresql
    port: 5432
  tls: {}

postgresql:
  architecture: standalone
  primary:
    persistence:
      size: 10Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1024Mi
      requests:
        cpu: 10m
        memory: 128Mi
