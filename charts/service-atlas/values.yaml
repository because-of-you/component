replicaCount: 2
revisionHistoryLimit: 3
terminationGracePeriodSeconds: 30

image:
  repository: ghcr.io/because-of-you/service-atlas
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingressRoute:
  enabled: false
  host: ""
  entryPoints: []
  middlewares: []
  tls: {}

secretFiles:
  enabled: false
  existingSecret: ""
  items: []

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

probes:
  path: /healthz
  startup:
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    periodSeconds: 20
    timeoutSeconds: 1
    failureThreshold: 3

tmpVolume:
  sizeLimit: 16Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

catalogue:
  services: []
  relations: []
  flows: []
