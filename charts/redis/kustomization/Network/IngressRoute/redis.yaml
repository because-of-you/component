apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: redis-ingress-route-tcp

spec:
  entryPoints: # [1]
    - gravitation
  routes: # [2]
    - match: HostSNI(`redis.acitrus.cn`)           # [3]
      # priority: 10                  # [4]
      services: # [7]
        - name: redis-master                   # [8]
          port: 6379                  # [9]
          # weight: 10                  # [10]
          # proxyProtocol: # [11]
          #   version: 1                # [12]
          # serversTransport: transport # [13]
          # nativeLB: true              # [14]
          # nodePortLB: true            # [15]
          # tls: false                  # [16]
  tls:
    domains:
      - main: acitrus.cn
        sans:
          - redis.acitrus.cn
