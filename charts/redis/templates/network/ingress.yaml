{{- if .Values.redisIngress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ .Values.redisIngress.name | quote }}
spec:
  entryPoints:
    {{- toYaml .Values.redisIngress.entryPoints | nindent 4 }}
  routes:
    - match: HostSNI(`{{ .Values.redisIngress.host }}`)
      services:
        - name: {{ .Values.redisIngress.service.name | quote }}
          port: {{ .Values.redisIngress.service.port }}
  {{- with .Values.redisIngress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
