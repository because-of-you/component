displayName: Casdoor Enforcer
type: middleware

import: github.com/because-of-you/casdoor-enforcer

summary: Authorize authenticated Traefik requests with Casdoor Casbin policies.

testData:
  endpoint: http://casdoor.infra.svc.cluster.local:8000
  permissionId: built-in/gateway
  clientId: example-client-id
  clientSecretEnv: CASDOOR_ENFORCER_CLIENT_SECRET
  subjectHeader: X-Casdoor-Subject
  timeout: 2s
