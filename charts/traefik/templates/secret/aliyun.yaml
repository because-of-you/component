{{- if .Values.aliyunSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.aliyunSecret.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
type: Opaque
stringData:
  ALICLOUD_ACCESS_KEY: {{ required "aliyunSecret.accessKey is required when aliyunSecret.enabled=true" .Values.aliyunSecret.accessKey | quote }}
  ALICLOUD_SECRET_KEY: {{ required "aliyunSecret.secretKey is required when aliyunSecret.enabled=true" .Values.aliyunSecret.secretKey | quote }}
{{- end }}
