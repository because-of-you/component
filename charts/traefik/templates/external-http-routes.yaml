{{- range .Values.externalHttpRoutes }}
{{- $name := required "externalHttpRoutes[].name is required" .name }}
{{- $host := required "externalHttpRoutes[].host is required" .host }}
{{- $address := required "externalHttpRoutes[].address is required" .address }}
{{- $port := required "externalHttpRoutes[].port is required" .port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name | quote }}
  namespace: {{ $.Release.Namespace }}
spec:
  ports:
    - name: http
      port: {{ $port }}
      targetPort: {{ $port }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ printf "%s-1" $name | quote }}
  namespace: {{ $.Release.Namespace }}
  labels:
    kubernetes.io/service-name: {{ $name | quote }}
    endpointslice.kubernetes.io/managed-by: traefik-external-http-routes
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: {{ $port }}
endpoints:
  - addresses:
      - {{ $address | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $name | quote }}
  namespace: {{ $.Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: {{ printf "Host(`%s`)" $host | quote }}
      services:
        - name: {{ $name | quote }}
          port: {{ $port }}
  tls: {}
{{- end }}
