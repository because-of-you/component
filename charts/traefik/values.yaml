aliyunSecret:
  enabled: false
  name: alidns
  accessKey: ""
  secretKey: ""

traefik:
  # https://blog.csdn.net/sinat_32188225/article/details/124117638
  envFrom:
    - secretRef:
        name: alidns

  env:
    - name: CASDOOR_ENFORCER_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: casdoor-traefik-auth
          key: client-secret
          optional: true

  experimental:
    plugins:
      traefikoidc:
        moduleName: github.com/lukaszraczylo/traefikoidc
        version: v1.0.29
    localPlugins:
      casdoorEnforcer:
        type: localPath
        moduleName: github.com/because-of-you/casdoor-enforcer
        volumeName: casdoor-enforcer-plugin
        mountPath: /plugins-local/src/github.com/because-of-you/casdoor-enforcer

  ports:
    #  tcp-websecure:
    #    port: 443
    #    expose:
    #      default: true

    gravitation:
      port: 1024
      expose:
        default: true
      exposedPort: 1024
      protocol: TCP
    #
    #    tls:
    #      enabled: true
    #      options: ""
    #      certResolver: "leresolver"
    #      domains:
    #        - main: "acitrus.cn"
    #          sans:
    #            - "*.acitrus.cn"

    websecure:
      http3:
        ## -- Enable HTTP/3 on the entrypoint
        ## Enabling it will also enable http3 experimental feature
        ## https://doc.traefik.io/traefik/routing/entrypoints/#http3
        ## There are known limitations when trying to listen on same ports for
        ## TCP & UDP (Http3). There is a workaround in this chart using dual Service.
        ## https://github.com/kubernetes/kubernetes/issues/47249#issuecomment-587960741
        enabled: true
        advertisedPort: 443  # @schema type:[integer, null]; minimum:0
      http:
        tls:
          enabled: true
          options: ""
          certResolver: "leresolver"
          domains:
            - main: "acitrus.cn"
              sans:
                - "*.acitrus.cn"
                - "*.ui.acitrus.cn"
                - "*.tcp.acitrus.cn"


  # -- Certificates resolvers configuration.
  # Ref: https://doc.traefik.io/traefik/https/acme/#certificate-resolvers
  # See EXAMPLES.md for more details.
  certificatesResolvers:
    leresolver:
      acme:
        storage: /data/acme.json
        email: "mail@acitrus.cn"
        dnsChallenge:
          provider: alidns
          delayBeforeCheck: 0

  persistence:
    # -- Enable persistence using Persistent Volume Claims
    # ref: http://kubernetes.io/docs/user-guide/persistent-volumes/.
    # It can be used to store TLS certificates along with `certificatesResolvers.<name>.acme.storage`  option
    enabled: true

  deployment:
    additionalVolumes:
      - name: casdoor-enforcer-plugin
        configMap:
          name: casdoor-enforcer-plugin
    initContainers:
      # The "volume-permissions" init container is required if you run into permission issues.
      # Related issue: https://github.com/traefik/traefik-helm-chart/issues/396
      - name: volume-permissions
        image: busybox:latest
        command: [ "sh", "-c", "touch /data/acme.json; chmod -v 600 /data/acme.json" ]
        volumeMounts:
          - name: data
            mountPath: /data

  ingressRoute:
    dashboard:
      enabled: true
#      annotations:
#        gethomepage.dev/href: "https://traefik.acitrus.cn"
#        gethomepage.dev/enabled: "true"
#        gethomepage.dev/description: "traefik dashboard"
#        gethomepage.dev/group: Gateway
#        gethomepage.dev/name: traefik
#        gethomepage.dev/namespace: traefik
#        gethomepage.dev/ping: "traefik.acitrus.cn"
#        gethomepage.dev/pod-selector: "app.kubernetes.io/name=traefik"
#        gethomepage.dev/widget.type: "traefik"
#        gethomepage.dev/widget.url: "https://traefik.acitrus.cn"
      matchRule: Host(`traefik.acitrus.cn`)
      entryPoints:
        - websecure
        - web
  #    middlewares:
  #      - name: http-to-https
  #        namespace: 'default'
  #      - name: 'forwardauth-authelia' # name of your middleware, as defined in your middleware.yml
  #        namespace: 'default'

  providers: # @schema additionalProperties: false
    kubernetesCRD:
      # -- Allows IngressRoute to reference resources in namespace other than theirs
      allowCrossNamespace: true
      enabled: true

casdoorAuthorization:
  enabled: false
  providerURL: ""
  enforceEndpoint: http://casdoor.infra.svc.cluster.local:8000
  clientID: ""
  permissionID: ""
  oidc:
    callbackURL: /oauth2/callback
    logoutURL: /oauth2/logout
    postLogoutRedirectURI: /
    cookieDomain: ""
    forceHTTPS: true
    strictAudienceValidation: true
  enforcer:
    subjectHeader: X-Casdoor-Subject
    timeout: 2s
  middlewares:
    oidcName: casdoor-oidc
    enforcerName: casdoor-enforcer
    chainName: casdoor-protected
