## @param logLevel Log level for the ZooKeeper server. ERROR by default
## Have in mind if you set it to INFO or WARN the ReadinessProve will produce a lot of logs
##
logLevel: INFO
## @param jvmFlags Default JVM flags for the ZooKeeper process
##
jvmFlags: "-XX:+UseContainerSupport -XX:InitialRAMPercentage=40.0 -XX:MaxRAMPercentage=70.0 -Xshareclasses:cacheDir=/tmp/javasharedresources,name=cache -Xtune:virtualized -Xquickstart"

replicaCount: 3

global:
  security:
    allowInsecureImages: true

resources:
  requests:
    cpu: 20m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 1024Mi