rustfsIngress:
  enabled: false
  host: ""
  # Optional additional hostnames for the same console and S3 API routes.
  # When set, this list replaces `host` in the generated Host rule.
  hosts: []
  service:
    name: ""
    apiPort: 9000
    consolePort: 9001
  console:
    name: rustfs-console
    entryPoints: []
  api:
    name: rustfs-s3-api
    entryPoints: []
  tls: {}

rustfs:
  secret:
    existingSecret: rustfs-secrets
  ingress:
    enabled: false
  gatewayApi:
    enabled: false
