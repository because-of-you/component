apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ldap.acitrus.cn
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
  annotations:
    gethomepage.dev/href: "https://ldap.acitrus.cn"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: ldap
    gethomepage.dev/group: Gateway
    # gethomepage.dev/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/homepage.png
    gethomepage.dev/name: ldap
    gethomepage.dev/ping: https://ldap.acitrus.cn
    #    gethomepage.dev/widget.type: "emby"
    #    gethomepage.dev/widget.url: "https://home.acitrus.cn"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=iam"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # https://doc.traefik.io/traefik/middlewares/overview/
    - kind: Rule
      match: Host(`ldap.acitrus.cn`)
      services:
        - kind: Service
          name: iam-http
          port: 17170
      middlewares:
        - name: http-to-https
#        - name: 'forwardauth-authelia' # name of your middleware, as defined in your middleware.yml
#          namespace: 'authelia'