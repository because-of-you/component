# Kafka 组件配置示例

# 副本数配置
replicaCount: 3

# 镜像配置
image:
  repository: bitnami/kafka
  tag: 3.4.0
  pullPolicy: IfNotPresent

# 服务配置
service:
  type: ClusterIP
  port: 9092
  nodePort: null
  externalTrafficPolicy: Cluster
  loadBalancerIP: ""

# 持久化配置
persistence:
  enabled: true
  storageClass: ""
  size: 8Gi
  accessModes:
    - ReadWriteOnce

# 资源配置
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1
    memory: 2Gi

# 认证配置
authentication:
  enabled: false
  clientProtocol: "plaintext"  # plaintext, tls, sasl, or sasl_tls
  interBrokerProtocol: "PLAINTEXT"
  sasl:
    mechanisms: ["PLAIN"]
    usernames: []
    passwords: []

# ZooKeeper 配置
zookeeper:
  enabled: true
  replicaCount: 3
  persistence:
    enabled: true
    size: 8Gi

# 配置覆盖
configurationOverrides:
  # 示例配置
  auto.create.topics.enable: "true"
  log.retention.hours: "168"
  log.retention.bytes: "1073741824"
  num.partitions: "3"
  default.replication.factor: "2"
  min.insync.replicas: "1"
  offsets.topic.replication.factor: "1"
  transaction.state.log.replication.factor: "1"
  transaction.state.log.min.isr: "1"
