repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: traefik
    url: https://traefik.github.io/charts

helmDefaults:
  atomic: true
  wait: true
  waitForJobs: true
  timeout: 600

---

environments:
  dev:
    values:
      - environments/dev/values.yaml
  prod:
    values:
      - environments/prod/values.yaml

---

releases:
  - name: test-charts
    namespace: app
    createNamespace: true
    chart: ./charts/test-charts
    values:
      - ./environments/{{ .Environment.Name }}/test-charts/values.yaml

  - name: redis
    namespace: infra
    createNamespace: true
    chart: ./charts/redis
    labels:
      deployment: dev-core
    values:
      - ./environments/{{ .Environment.Name }}/redis/values.yaml

  - name: postgresql
    namespace: infra
    createNamespace: true
    chart: ./charts/postgresql
    labels:
      deployment: dev-core
    values:
      - ./environments/{{ .Environment.Name }}/postgresql/values.yaml

  - name: rabbitmq
    namespace: infra
    createNamespace: true
    chart: ./charts/rabbitmq
    values:
      - ./environments/{{ .Environment.Name }}/rabbitmq/values.yaml

  - name: casdoor
    namespace: infra
    createNamespace: true
    chart: ./charts/casdoor
    values:
      - ./environments/{{ .Environment.Name }}/casdoor/values.yaml

  - name: authelia
    namespace: infra
    createNamespace: true
    chart: ./charts/authelia
    values:
      - ./environments/{{ .Environment.Name }}/authelia/values.yaml

  - name: traefik
    namespace: traefik
    createNamespace: true
    chart: ./charts/traefik
    labels:
      deployment: dev-core
    values:
      - ./environments/{{ .Environment.Name }}/traefik/values.yaml
