repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: traefik
    url: https://traefik.github.io/charts
  - name: authelia
    url: https://charts.authelia.com
  - name: lldap
    url: https://evantage-ws.github.io/lldap-kubernetes/
  - name: rustfs
    url: https://charts.rustfs.com
  - name: jetstack
    url: https://charts.jetstack.io
  - name: cert-manager-alidns-webhook
    url: https://devmachine-fr.github.io/cert-manager-alidns-webhook

helmDefaults:
  atomic: true
  wait: true
  waitForJobs: true
  timeout: 600

---

environments:
  dev:
    values:
      - environments/dev/values.yaml

---

releases:
  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: ./charts/cert-manager
    labels:
      component: cert-manager
    values:
      - ./environments/{{ .Environment.Name }}/cert-manager/values.yaml

  - name: cert-manager-alidns-webhook
    namespace: cert-manager
    chart: cert-manager-alidns-webhook/alidns-webhook
    version: 0.8.3
    labels:
      component: cert-manager
    needs:
      - cert-manager/cert-manager
    values:
      - ./environments/{{ .Environment.Name }}/cert-manager-webhook/values.yaml

  - name: cert-manager-resources
    namespace: cert-manager
    createNamespace: true
    chart: ./charts/cert-manager-resources
    labels:
      component: cert-manager
    needs:
      - cert-manager/cert-manager-alidns-webhook
    values:
      - ./environments/{{ .Environment.Name }}/cert-manager-resources/values.yaml

  - name: test-charts
    namespace: app
    createNamespace: true
    chart: ./charts/test-charts
    values:
      - ./environments/{{ .Environment.Name }}/test-charts/values.yaml

  - name: claude-code-hub
    namespace: app
    createNamespace: true
    chart: ./charts/claude-code-hub
    needs:
      - infra/postgresql
      - infra/redis
    values:
      - ./environments/{{ .Environment.Name }}/claude-code-hub/values.yaml

  - name: dbx
    namespace: app
    createNamespace: true
    chart: ./charts/dbx
    values:
      - ./environments/{{ .Environment.Name }}/dbx/values.yaml

  - name: service-atlas
    namespace: app
    createNamespace: true
    chart: ./charts/service-atlas
    values:
      - ./environments/{{ .Environment.Name }}/service-atlas/values.yaml

  - name: redis
    namespace: infra
    createNamespace: true
    chart: ./charts/redis
    values:
      - ./environments/{{ .Environment.Name }}/redis/values.yaml

  - name: postgresql
    namespace: infra
    createNamespace: true
    chart: ./charts/postgresql
    values:
      - ./environments/{{ .Environment.Name }}/postgresql/values.yaml

  - name: lldap
    namespace: infra
    createNamespace: true
    chart: ./charts/lldap
    needs:
      - infra/postgresql
    values:
      - ./environments/{{ .Environment.Name }}/lldap/values.yaml

  - name: rabbitmq
    namespace: infra
    createNamespace: true
    chart: ./charts/rabbitmq
    values:
      - ./environments/{{ .Environment.Name }}/rabbitmq/values.yaml

  - name: authelia
    namespace: infra
    createNamespace: true
    chart: ./charts/authelia
    needs:
      - infra/lldap
    values:
      - ./environments/{{ .Environment.Name }}/authelia/values.yaml

  - name: rustfs
    namespace: infra
    createNamespace: true
    chart: ./charts/rustfs
    needs:
      - infra/authelia
    values:
      - ./environments/{{ .Environment.Name }}/rustfs/values.yaml

  - name: robustmq
    namespace: infra
    createNamespace: true
    chart: ./charts/robustmq
    needs:
      - infra/authelia
    values:
      - ./environments/{{ .Environment.Name }}/robustmq/values.yaml

  - name: traefik
    namespace: traefik
    createNamespace: true
    chart: ./charts/traefik
    values:
      - ./environments/{{ .Environment.Name }}/traefik/values.yaml
