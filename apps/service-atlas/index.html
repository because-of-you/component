<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Service Atlas</title>
    <link rel="preload" href="./assets/atlas-map.webp" as="image" type="image/webp" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="atlas" aria-label="服务导览地图">
      <div class="atlas-scroll">
        <div class="atlas-stage">
          <img
            class="atlas-landscape"
            src="./assets/atlas-map.webp"
            alt=""
            draggable="false"
          />
          <div id="atlas-overlay"></div>
        </div>
      </div>
      <p id="atlas-error" hidden>地图暂时无法显示。</p>
    </main>
    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
